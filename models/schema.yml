version: 2

models:
  - name: stg_customers
    description: >-
      One row per TPC-H customer, with standardized customer and nation keys,
      contact details, account balance, and market segment for downstream joins
      and customer analysis.

  - name: stg_line_items
    description: >-
      One row per line item within a TPC-H order, identified by order_key and
      line_number. Includes part and supplier keys, quantities, shipping details,
      and calculated unit prices and gross, discount, tax, and net sales amounts.
      Discounts are represented as negative amounts; net sales include tax.

  - name: stg_nations
    description: >-
      One row per TPC-H nation, with its standardized nation key, name, region
      key, and source comment for geographic enrichment.

  - name: stg_orders
    description: >-
      One row per TPC-H order, with standardized order and customer keys, order
      date, status, source total price, clerk, and order and shipping priorities.

  - name: stg_part_suppliers
    description: >-
      One row per TPC-H part and supplier combination, with available quantity,
      supply cost, and source comment describing the supplier's offering.

  - name: stg_parts
    description: >-
      One row per TPC-H part, with its standardized part key, name, manufacturer,
      brand, type, size, container, retail price, and source comment.

  - name: stg_regions
    description: >-
      One row per TPC-H region, with its standardized region key, name, and source
      comment for grouping nations into geographic regions.

  - name: stg_suppliers
    description: >-
      One row per TPC-H supplier, with standardized supplier and nation keys,
      name, address, phone number, account balance, and source comment.

  - name: dim_customers
    description: >-
      One row per customer with matching nation and region records. Enriches
      staged customer contact details, account balance, and market segment with
      nation and region names; customers without matching geography are excluded.

  - name: fct_orders
    description: >-
      One row per order with matching line items and a matching customer. Combines
      order dates, statuses, priorities, and clerk details with customer name and
      market segment, plus order-level sums of gross sales, negative discounts,
      tax, and tax-inclusive net sales calculated from line items. Applies no
      order-status or return-status filter.
