models:
  - name: stg_orders
    description: >-
      Order headers from the TPCH orders source, with source columns renamed
      for downstream use. One row per source order, identified by order_key,
      containing the customer key, order date, total price, status, and
      fulfillment priorities. No order-status filtering is applied.

  - name: stg_customers
    description: >-
      Customer records from the TPCH customer source, with source columns
      renamed for downstream use. One row per source customer, identified by
      customer_key, containing the customer name, contact details, nation key,
      account balance, and market segment used to categorize order sales.

  - name: stg_line_items
    description: >-
      Order line items from the TPCH lineitem source, at the grain of order_key
      and line_number. Renames source fields and calculates unit pricing,
      discounted sales, discount amounts, tax amounts, and net item sales.
      Gross item sales are the extended line price; discounts are represented
      as negative amounts, tax is applied after discounts, and net item sales
      include both discounts and tax. Unit price is null when quantity is zero.

  - name: fct_orders
    description: >-
      Order-level sales fact combining stg_orders with line-item amounts
      aggregated by order_key and customer attributes from stg_customers.
      Contains gross item sales, negative discount amounts, tax amounts, and
      net item sales, together with the order date, customer name, and market
      segment. Inner joins retain only orders with matching line-item and
      customer records. No order-status filtering is applied. Supplies the
      order-level gross sales used by monthly_sales.

  - name: stg_regions
    description: >-
      Region records from the TPCH region source, with source columns renamed
      for downstream use. One row per source region, identified by region_key,
      containing the region name and source comment.

  - name: stg_nations
    description: >-
      Nation records from the TPCH nation source, with source columns renamed
      for downstream use. One row per source nation, identified by nation_key,
      containing the nation name, parent region key, and source comment.

  - name: dim_customers
    description: >-
      Customer dimension combining stg_customers with nation and region names
      from stg_nations and stg_regions. One row per customer with contact
      details, account balance, and market segment. Inner joins retain only
      customers with matching nation and region records.
