version: 2

# Schema overview: Analytics models built from Snowflake's TPCH sample data.
# The marts describe customers and order-level sales for reporting.
# This file documents dbt models; it does not set the target Snowflake schema.
# Monthly sales documentation and tests remain in monthly_sales.yml.

models:
  - name: fct_orders
    description: >-
      Order-level sales fact table built from TPCH orders, line items, and
      customers. The intended grain is one row per order_key. Includes only
      orders with matching line items and a matching customer, with no order
      status filter. Line-item amounts are aggregated to the order level,
      and customer name and market segment are attached for reporting.
    columns:
      - name: order_key
        description: "Order identifier from TPCH orders; the intended key of this model."
      - name: order_date
        description: "Date the order was placed, as recorded in TPCH orders."
      - name: customer_key
        description: "Identifier of the customer who placed the order; joins to dim_customers.customer_key."
      - name: status_code
        description: "Order status code carried through from the source without filtering or decoding."
      - name: priority_code
        description: "Order priority code carried through from TPCH orders."
      - name: ship_priority
        description: "Shipping priority value recorded on the source order."
      - name: clerk_name
        description: "Clerk identifier recorded on the source order."
      - name: name
        description: "Name of the customer who placed the order, from stg_customers."
      - name: market_segment
        description: "Market segment of the customer who placed the order, from stg_customers."
      - name: gross_item_sales_amount
        description: >-
          Sum of line-item extended prices for the order, before discounts
          and tax. Each line's extended price already includes its quantity.
      - name: item_discount_amount
        description: >-
          Sum of line-item discount amounts for the order. Discounts are
          represented as negative amounts and reduce gross item sales.
      - name: item_tax_amount
        description: >-
          Sum of line-item tax amounts for the order. Each line's tax is
          calculated on its gross sales amount after applying its discount.
      - name: net_item_sales_amount
        description: >-
          Sum of line-item net sales amounts for the order, calculated as
          gross item sales plus negative discount amounts plus tax.

  - name: dim_customers
    description: >-
      Customer dimension built from TPCH customers with nation and region
      names. The intended grain is one row per customer_key. Customers are
      retained through left joins even when matching geography is missing;
      no order activity is required for a customer to appear.
    columns:
      - name: customer_key
        description: "Customer identifier from TPCH customer; the intended key of this model."
      - name: name
        description: "Customer name recorded in the source customer data."
      - name: address
        description: "Customer address recorded in the source customer data."
      - name: nation_name
        description: "Customer's nation name, joined using the source nation key; null if no nation matches."
      - name: region_name
        description: "Region name associated with the customer's nation; null if matching geography is unavailable."
      - name: phone_number
        description: "Customer phone number as recorded in the source, with no additional formatting or validation."
      - name: account_balance
        description: "Account balance recorded in TPCH customer; this is a source value, not a calculation from orders."
      - name: market_segment
        description: "Customer market segment recorded in TPCH customer."
      - name: comment
        description: "Free-text comment carried through from the source customer record."
