version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order month and market segment. Aggregates gross item sales from
      fct_orders using the order date. Includes all order statuses present
      in fct_orders; months and segments without orders are not filled in.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          description: Ensures each order month and market segment appears only once.
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month.
          Together with market_segment, defines the grain of this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment joined onto each order in fct_orders.
          Together with order_month, defines the grain of this model.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount for orders in the month and market
          segment. Represents gross line-item sales before discounts and tax,
          not net revenue. Uses the same currency units as the source data.
        data_tests:
          - not_null
