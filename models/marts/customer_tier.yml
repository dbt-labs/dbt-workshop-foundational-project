version: 2

models:
  - name: customer_tier
    description: >-
      Full-rebuild replacement for retail_datamart.build_customer_tier, with
      one row per customer having at least one matching order. Sums order-header
      total_price across all orders, without status or date filters. Preserves
      the procedure's CASE order and thresholds; these thresholds remain subject
      to finance review. Built in the configured dbt target schema.
    columns:
      - name: customer_key
        description: Customer key from stg_customers; customers without orders are excluded.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: lifetime_value
        description: >-
          Sum of matching order-header total_price, stored as numeric(38,2).
          Remains null when all matching order totals are null. Tier classification
          uses the sum before the output cast, matching the procedure.
      - name: tier_name
        description: >-
          Ordered legacy bands: tier1 for values <= 200000, tier2 for values
          > 2000000, tier3 for 1000000 through 1999999 inclusive, then tier4
          for 0 through 999999 inclusive. The earlier tier1 branch takes
          precedence over tier4. Values strictly between 999999 and 1000000,
          or strictly above 1999999 through 2000000 inclusive, and null sums
          produce null. Null tiers emit a warning, matching the procedure's notice.
        data_tests:
          - accepted_values:
              arguments:
                values: ['tier1', 'tier2', 'tier3', 'tier4']
          - not_null:
              name: customer_tier_null_band_warning
              config:
                severity: warn

unit_tests:
  - name: customer_tier_preserves_legacy_boundaries
    description: Preserves ordered CASE bands, both uncovered ranges, and negative values.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
          - {customer_key: 5}
          - {customer_key: 6}
          - {customer_key: 7}
          - {customer_key: 8}
          - {customer_key: 9}
          - {customer_key: 10}
          - {customer_key: 11}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: -1.00}
          - {customer_key: 2, total_price: 0.00}
          - {customer_key: 3, total_price: 200000.00}
          - {customer_key: 4, total_price: 200000.01}
          - {customer_key: 5, total_price: 999999.00}
          - {customer_key: 6, total_price: 999999.50}
          - {customer_key: 7, total_price: 1000000.00}
          - {customer_key: 8, total_price: 1999999.00}
          - {customer_key: 9, total_price: 1999999.50}
          - {customer_key: 10, total_price: 2000000.00}
          - {customer_key: 11, total_price: 2000000.01}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: -1.00, tier_name: tier1}
        - {customer_key: 2, lifetime_value: 0.00, tier_name: tier1}
        - {customer_key: 3, lifetime_value: 200000.00, tier_name: tier1}
        - {customer_key: 4, lifetime_value: 200000.01, tier_name: tier4}
        - {customer_key: 5, lifetime_value: 999999.00, tier_name: tier4}
        - {customer_key: 6, lifetime_value: 999999.50, tier_name: null}
        - {customer_key: 7, lifetime_value: 1000000.00, tier_name: tier3}
        - {customer_key: 8, lifetime_value: 1999999.00, tier_name: tier3}
        - {customer_key: 9, lifetime_value: 1999999.50, tier_name: null}
        - {customer_key: 10, lifetime_value: 2000000.00, tier_name: null}
        - {customer_key: 11, lifetime_value: 2000000.01, tier_name: tier2}

  - name: customer_tier_preserves_aggregation_and_inner_join
    description: Sums multiple orders, ignores null totals, preserves all-null sums, and excludes unmatched rows.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: 150000.00}
          - {customer_key: 1, total_price: 100000.00}
          - {customer_key: 1, total_price: null}
          - {customer_key: 2, total_price: null}
          - {customer_key: 4, total_price: 500000.00}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: 250000.00, tier_name: tier4}
        - {customer_key: 2, lifetime_value: null, tier_name: null}
