version: 2

models:
  - name: customer_tier
    description: >-
      Customer lifetime order value and legacy tier, migrated from
      retail_datamart.build_customer_tier in stored_procs/customer_tier.sql.
      One row per customer with at least one matching order; customers without
      orders and orders without matching customers are excluded by an inner join.
      Rebuilt as a table on each run. Reuses stg_customers and stg_orders, the
      project's TPCH customer and order staging models. All order statuses and
      dates are included. Preserves the procedure's ordered CASE, including
      negative values in tier1 and intentional NULL gaps. Thresholds remain
      legacy business rules pending finance review; this conversion does not
      revise them. The procedural NULL-count notice is replaced by a warning
      data test so the NULL bucket remains visible without failing the build.
    columns:
      - name: customer_key
        description: >-
          Customer identifier from stg_customers, stored as NUMBER(38,0).
          Unique at this model's one-row-per-matched-customer grain.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: lifetime_value
        description: >-
          Sum of total_price over all matching orders, stored as NUMBER(38,2).
          No date or status filters, currency conversion, or NULL-to-zero
          replacement are applied. NULL when every matched order price is NULL.
          Tier classification uses the sum before the final storage cast,
          matching the procedure's INSERT behavior.
      - name: tier_name
        description: >-
          Legacy ordered classification: tier1 for lifetime_value <= 200000;
          tier2 for lifetime_value > 2000000; tier3 for 1000000 through 1999999
          inclusive; otherwise tier4 for 0 through 999999 inclusive. Because
          tier1 is evaluated first, tier4 effectively covers > 200000 through
          999999. NULL for (999999, 1000000), (1999999, 2000000], or a NULL
          lifetime value. These gaps and CASE precedence are preserved exactly.
        data_tests:
          - accepted_values:
              arguments:
                values: ['tier1', 'tier2', 'tier3', 'tier4']
          - not_null:
              name: customer_tier_null_bucket_warning
              config:
                severity: warn

unit_tests:
  - name: customer_tier_preserves_legacy_boundaries
    description: >-
      Locks down ordered tier precedence, exact endpoints, fractional gaps,
      negative and zero values, and NULL totals from the legacy procedure.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
          - {customer_key: 5}
          - {customer_key: 6}
          - {customer_key: 7}
          - {customer_key: 8}
          - {customer_key: 9}
          - {customer_key: 10}
          - {customer_key: 11}
          - {customer_key: 12}
          - {customer_key: 13}
          - {customer_key: 14}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: -1}
          - {customer_key: 2, total_price: 0}
          - {customer_key: 3, total_price: 199999.99}
          - {customer_key: 4, total_price: 200000}
          - {customer_key: 5, total_price: 200000.01}
          - {customer_key: 6, total_price: 999999}
          - {customer_key: 7, total_price: 999999.01}
          - {customer_key: 8, total_price: 1000000}
          - {customer_key: 9, total_price: 1500000}
          - {customer_key: 10, total_price: 1999999}
          - {customer_key: 11, total_price: 1999999.01}
          - {customer_key: 12, total_price: 2000000}
          - {customer_key: 13, total_price: 2000000.01}
          - {customer_key: 14, total_price: null}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: -1, tier_name: tier1}
        - {customer_key: 2, lifetime_value: 0, tier_name: tier1}
        - {customer_key: 3, lifetime_value: 199999.99, tier_name: tier1}
        - {customer_key: 4, lifetime_value: 200000, tier_name: tier1}
        - {customer_key: 5, lifetime_value: 200000.01, tier_name: tier4}
        - {customer_key: 6, lifetime_value: 999999, tier_name: tier4}
        - {customer_key: 7, lifetime_value: 999999.01, tier_name: null}
        - {customer_key: 8, lifetime_value: 1000000, tier_name: tier3}
        - {customer_key: 9, lifetime_value: 1500000, tier_name: tier3}
        - {customer_key: 10, lifetime_value: 1999999, tier_name: tier3}
        - {customer_key: 11, lifetime_value: 1999999.01, tier_name: null}
        - {customer_key: 12, lifetime_value: 2000000, tier_name: null}
        - {customer_key: 13, lifetime_value: 2000000.01, tier_name: tier2}
        - {customer_key: 14, lifetime_value: null, tier_name: null}

  - name: customer_tier_aggregates_matching_orders_only
    description: >-
      Sums multiple orders before tiering, ignores NULL prices in mixed sums,
      includes all statuses, and excludes customers without orders and orphan
      orders, matching the procedure's inner join.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: 150000, status_code: O}
          - {customer_key: 1, total_price: 100000, status_code: F}
          - {customer_key: 1, total_price: null, status_code: P}
          - {customer_key: 2, total_price: 1000000, status_code: O}
          - {customer_key: 2, total_price: 1000000.01, status_code: F}
          - {customer_key: 999, total_price: 500000, status_code: O}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: 250000, tier_name: tier4}
        - {customer_key: 2, lifetime_value: 2000000.01, tier_name: tier2}
