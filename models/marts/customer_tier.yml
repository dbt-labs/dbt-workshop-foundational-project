version: 2

models:
  - name: customer_tier
    description: >-
      Full-rebuild customer tier table replacing
      retail_datamart.build_customer_tier(), with one row per customer with
      at least one matching order. Inner joins stg_customers to stg_orders
      and sums all order-header total_price values, without date or status
      filters. Customers without orders and orders without matching customers
      are excluded. Preserves the legacy CASE order and thresholds, which
      remain provisional pending finance review; this migration does not
      change tier policy. Classification uses the unrounded sum before the
      output is cast to the procedure's numeric precision. NULL tiers are
      monitored with a warning-level test, replacing the procedure's notice.
    columns:
      - name: customer_key
        description: >-
          Customer identifier from stg_customers, cast to NUMBER(38, 0).
          Unique at this model's customer grain.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key

      - name: lifetime_value
        description: >-
          Sum of all matching order-header total_price values, cast to
          NUMBER(38, 2). Uses the source currency and includes all order
          statuses; this is not the line-item sales measure in fct_orders.
          SUM ignores NULL amounts and returns NULL when every amount for
          a customer is NULL; such customers remain in this model.

      - name: tier_name
        description: >-
          Legacy ordered classification: tier1 for lifetime_value <= 200000
          (including negative values); tier2 for values > 2000000; tier3
          for 1000000 through 1999999 inclusive; tier4 for the remaining
          values from 0 through 999999, effectively > 200000 through 999999.
          NULL for NULL lifetime_value, values strictly between 999999 and
          1000000, and values > 1999999 through 2000000 inclusive. Branch
          order is intentional and must be preserved for reporting parity.
        data_tests:
          - accepted_values:
              arguments:
                values: ['tier1', 'tier2', 'tier3', 'tier4']
          - not_null:
              name: customer_tier_null_tiers_warning
              config:
                severity: warn

unit_tests:
  - name: customer_tier_preserves_legacy_boundaries
    description: >-
      Protects branch precedence, negative and zero amounts, exact endpoints,
      fractional gaps, and the NULL result at exactly 2000000.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
          - {customer_key: 5}
          - {customer_key: 6}
          - {customer_key: 7}
          - {customer_key: 8}
          - {customer_key: 9}
          - {customer_key: 10}
          - {customer_key: 11}
          - {customer_key: 12}
          - {customer_key: 13}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: -0.01}
          - {customer_key: 2, total_price: 0}
          - {customer_key: 3, total_price: 199999.99}
          - {customer_key: 4, total_price: 200000}
          - {customer_key: 5, total_price: 200000.01}
          - {customer_key: 6, total_price: 999999}
          - {customer_key: 7, total_price: 999999.01}
          - {customer_key: 8, total_price: 999999.99}
          - {customer_key: 9, total_price: 1000000}
          - {customer_key: 10, total_price: 1999999}
          - {customer_key: 11, total_price: 1999999.01}
          - {customer_key: 12, total_price: 2000000}
          - {customer_key: 13, total_price: 2000000.01}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: -0.01, tier_name: tier1}
        - {customer_key: 2, lifetime_value: 0, tier_name: tier1}
        - {customer_key: 3, lifetime_value: 199999.99, tier_name: tier1}
        - {customer_key: 4, lifetime_value: 200000, tier_name: tier1}
        - {customer_key: 5, lifetime_value: 200000.01, tier_name: tier4}
        - {customer_key: 6, lifetime_value: 999999, tier_name: tier4}
        - {customer_key: 7, lifetime_value: 999999.01, tier_name: null}
        - {customer_key: 8, lifetime_value: 999999.99, tier_name: null}
        - {customer_key: 9, lifetime_value: 1000000, tier_name: tier3}
        - {customer_key: 10, lifetime_value: 1999999, tier_name: tier3}
        - {customer_key: 11, lifetime_value: 1999999.01, tier_name: null}
        - {customer_key: 12, lifetime_value: 2000000, tier_name: null}
        - {customer_key: 13, lifetime_value: 2000000.01, tier_name: tier2}

  - name: customer_tier_aggregates_matching_orders
    description: >-
      Verifies aggregation before tiering, exclusion of customers without
      orders and orphan orders, and mixed/all-NULL amount behavior.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: 150000}
          - {customer_key: 1, total_price: 100000}
          - {customer_key: 2, total_price: null}
          - {customer_key: 2, total_price: 1000000}
          - {customer_key: 3, total_price: null}
          - {customer_key: 3, total_price: null}
          - {customer_key: 99, total_price: 3000000}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: 250000, tier_name: tier4}
        - {customer_key: 2, lifetime_value: 1000000, tier_name: tier3}
        - {customer_key: 3, lifetime_value: null, tier_name: null}
