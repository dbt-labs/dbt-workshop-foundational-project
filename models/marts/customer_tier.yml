version: 2

models:
  - name: customer_tier
    description: >-
      Customer lifetime order value and legacy reporting tier, with one row per
      customer_key that has at least one matching order. Replaces
      retail_datamart.build_customer_tier from stored_procs/customer_tier.sql
      using the project's stg_customers and stg_orders models. Rebuilt as a
      table on every run. Includes all order dates and statuses; customers
      without orders and orders without a matching customer are excluded.
      Preserves the procedure's order-dependent tier ladder and intentional
      NULL gaps. Thresholds remain provisional pending finance review; this
      migration does not revise business rules.
    columns:
      - name: customer_key
        description: >-
          Customer identifier from stg_customers, stored as NUMBER(38,0).
          Unique grain of this model; only customers with matching orders appear.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: lifetime_value
        description: >-
          SUM of stg_orders.total_price across all matching orders for the
          customer, stored as NUMBER(38,2). Uses order-header total price, not
          line-item revenue. SUM ignores NULL prices and returns NULL when all
          prices for a customer are NULL. Tier classification uses the sum
          before the output precision cast, matching the stored procedure.
      - name: tier_name
        description: >-
          First matching legacy CASE arm: tier1 for lifetime_value <= 200000
          (including negative values); tier2 for > 2000000; tier3 for 1000000
          through 1999999 inclusive; tier4 for the remaining values in 0
          through 999999, effectively > 200000 through 999999 inclusive.
          NULL for values > 999999 and < 1000000, values > 1999999 and
          <= 2000000, or a NULL lifetime_value. Arm order must be preserved.
        data_tests:
          - accepted_values:
              arguments:
                values: ['tier1', 'tier2', 'tier3', 'tier4']

unit_tests:
  - name: customer_tier_preserves_legacy_boundaries
    description: >-
      Locks the ordered tier ladder at exact and fractional boundaries,
      including negative values, zero, and both intentional NULL gaps.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
          - {customer_key: 5}
          - {customer_key: 6}
          - {customer_key: 7}
          - {customer_key: 8}
          - {customer_key: 9}
          - {customer_key: 10}
          - {customer_key: 11}
          - {customer_key: 12}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: -1.00}
          - {customer_key: 2, total_price: 0.00}
          - {customer_key: 3, total_price: 199999.99}
          - {customer_key: 4, total_price: 200000.00}
          - {customer_key: 5, total_price: 200000.01}
          - {customer_key: 6, total_price: 999999.00}
          - {customer_key: 7, total_price: 999999.01}
          - {customer_key: 8, total_price: 1000000.00}
          - {customer_key: 9, total_price: 1999999.00}
          - {customer_key: 10, total_price: 1999999.01}
          - {customer_key: 11, total_price: 2000000.00}
          - {customer_key: 12, total_price: 2000000.01}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: -1.00, tier_name: tier1}
        - {customer_key: 2, lifetime_value: 0.00, tier_name: tier1}
        - {customer_key: 3, lifetime_value: 199999.99, tier_name: tier1}
        - {customer_key: 4, lifetime_value: 200000.00, tier_name: tier1}
        - {customer_key: 5, lifetime_value: 200000.01, tier_name: tier4}
        - {customer_key: 6, lifetime_value: 999999.00, tier_name: tier4}
        - {customer_key: 7, lifetime_value: 999999.01, tier_name: null}
        - {customer_key: 8, lifetime_value: 1000000.00, tier_name: tier3}
        - {customer_key: 9, lifetime_value: 1999999.00, tier_name: tier3}
        - {customer_key: 10, lifetime_value: 1999999.01, tier_name: null}
        - {customer_key: 11, lifetime_value: 2000000.00, tier_name: null}
        - {customer_key: 12, lifetime_value: 2000000.01, tier_name: tier2}

  - name: customer_tier_aggregates_orders_and_preserves_inner_join
    description: >-
      Classifies the sum across orders, retains SQL SUM NULL semantics, and
      excludes customers without orders and orders without matching customers.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: 150000.00}
          - {customer_key: 1, total_price: 100000.50}
          - {customer_key: 2, total_price: null}
          - {customer_key: 2, total_price: null}
          - {customer_key: 3, total_price: 1000000.00}
          - {customer_key: 3, total_price: null}
          - {customer_key: 99, total_price: 3000000.00}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: 250000.50, tier_name: tier4}
        - {customer_key: 2, lifetime_value: null, tier_name: null}
        - {customer_key: 3, lifetime_value: 1000000.00, tier_name: tier3}
