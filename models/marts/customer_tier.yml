version: 2

models:
  - name: customer_tier
    description: >-
      Customer lifetime order value and legacy reporting tier, replacing
      retail_datamart.build_customer_tier. Rebuilt as a table with one row per
      customer_key having at least one matching order. Reuses stg_customers
      and stg_orders in place of the procedure's stg_tpch inputs. Sums order
      total_price across all dates and statuses without joining line items.
      Customers without orders and orders without a matching customer are
      excluded. Preserves the procedure's ordered CASE, overlapping ranges,
      and NULL gaps; thresholds remain legacy rules pending finance review.
    columns:
      - name: customer_key
        description: >-
          Customer identifier from stg_customers, stored as NUMBER(38, 0).
          Unique at this model's customer grain.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key

      - name: lifetime_value
        description: >-
          Sum of total_price for all matching orders, stored as NUMBER(38, 2)
          in source monetary units without currency conversion. Tier assignment
          uses the sum before the output cast, matching the procedure's insert
          semantics. SUM ignores NULL prices; all-NULL prices produce NULL
          lifetime_value and tier_name.

      - name: tier_name
        description: >-
          Legacy tier evaluated in this exact order on the unrounded sum:
          tier1 for values <= 200000 (including zero and negative values);
          tier2 for values > 2000000; tier3 for values from 1000000 through
          1999999 inclusive; tier4 for remaining values from 0 through 999999
          inclusive (effectively > 200000 and <= 999999). Values strictly
          between 999999 and 1000000, or > 1999999 and <= 2000000, and NULL
          lifetime values return NULL. NULL tiers warn rather than fail,
          preserving the stored procedure's diagnostic notice behavior.
        data_tests:
          - accepted_values:
              arguments:
                values: ['tier1', 'tier2', 'tier3', 'tier4']
          - not_null:
              name: customer_tier_null_tier_notice
              config:
                severity: warn

unit_tests:
  - name: customer_tier_preserves_legacy_boundaries
    description: >-
      Locks down CASE precedence, exact thresholds, fractional gaps, negative
      values, and the inclusive upper gap at 2000000.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
          - {customer_key: 5}
          - {customer_key: 6}
          - {customer_key: 7}
          - {customer_key: 8}
          - {customer_key: 9}
          - {customer_key: 10}
          - {customer_key: 11}
          - {customer_key: 12}
          - {customer_key: 13}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: -1.00}
          - {customer_key: 2, total_price: 0.00}
          - {customer_key: 3, total_price: 199999.99}
          - {customer_key: 4, total_price: 200000.00}
          - {customer_key: 5, total_price: 200000.01}
          - {customer_key: 6, total_price: 999999.00}
          - {customer_key: 7, total_price: 999999.01}
          - {customer_key: 8, total_price: 999999.99}
          - {customer_key: 9, total_price: 1000000.00}
          - {customer_key: 10, total_price: 1999999.00}
          - {customer_key: 11, total_price: 1999999.01}
          - {customer_key: 12, total_price: 2000000.00}
          - {customer_key: 13, total_price: 2000000.01}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: -1.00, tier_name: tier1}
        - {customer_key: 2, lifetime_value: 0.00, tier_name: tier1}
        - {customer_key: 3, lifetime_value: 199999.99, tier_name: tier1}
        - {customer_key: 4, lifetime_value: 200000.00, tier_name: tier1}
        - {customer_key: 5, lifetime_value: 200000.01, tier_name: tier4}
        - {customer_key: 6, lifetime_value: 999999.00, tier_name: tier4}
        - {customer_key: 7, lifetime_value: 999999.01, tier_name: null}
        - {customer_key: 8, lifetime_value: 999999.99, tier_name: null}
        - {customer_key: 9, lifetime_value: 1000000.00, tier_name: tier3}
        - {customer_key: 10, lifetime_value: 1999999.00, tier_name: tier3}
        - {customer_key: 11, lifetime_value: 1999999.01, tier_name: null}
        - {customer_key: 12, lifetime_value: 2000000.00, tier_name: null}
        - {customer_key: 13, lifetime_value: 2000000.01, tier_name: tier2}

  - name: customer_tier_aggregates_orders_and_preserves_inner_join
    description: >-
      Verifies aggregation before classification, ignored NULL prices,
      all-NULL totals, exclusion of customers without orders, and exclusion
      of orphan orders.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: 150000.00}
          - {customer_key: 1, total_price: 150000.00}
          - {customer_key: 2, total_price: null}
          - {customer_key: 3, total_price: 1000000.00}
          - {customer_key: 3, total_price: null}
          - {customer_key: 999, total_price: 5000000.00}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: 300000.00, tier_name: tier4}
        - {customer_key: 2, lifetime_value: null, tier_name: null}
        - {customer_key: 3, lifetime_value: 1000000.00, tier_name: tier3}
