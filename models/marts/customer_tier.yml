version: 2

models:
  - name: customer_tier
    description: >-
      Customer lifetime order value and legacy reporting tier, migrated from
      stored_procs/customer_tier.sql (retail_datamart.build_customer_tier).
      Rebuilt as a table with one row per customer having at least one matching
      staged order. Uses stg_customers and stg_orders directly; customers without
      orders and orders without matching customers are excluded. All order dates
      and statuses are included. The original first-match CASE order, thresholds,
      and NULL outcomes are preserved for reporting reconciliation. Thresholds
      remain provisional pending finance review; this conversion does not revise
      the business rules. A warning-level not_null test replaces the procedure's
      notice about NULL tiers.
    columns:
      - name: customer_key
        description: >-
          Customer identifier from stg_customers, stored as NUMBER(38,0).
          Unique at this model's customer grain.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: lifetime_value
        description: >-
          Sum of stg_orders.total_price for all matching customer orders, with
          no status or date filter. Stored as NUMBER(38,2); tier classification
          uses the sum before this output cast, matching the procedure. SUM
          ignores NULL prices and returns NULL if all matching prices are NULL.
          No currency conversion or unit rescaling is applied.
      - name: tier_name
        description: >-
          Legacy first-match tier: tier1 for lifetime_value <= 200000 (including
          negative values); tier2 for > 2000000; tier3 for 1000000 through 1999999
          inclusive; tier4 effectively for > 200000 through 999999 inclusive,
          because tier1 takes precedence over its nominal 0 through 999999 range.
          NULL for values strictly between 999999 and 1000000, values > 1999999
          through 2000000 inclusive, or a NULL lifetime value. NULLs are expected
          legacy behavior and produce a warning rather than a build failure.
        data_tests:
          - accepted_values:
              arguments:
                values: ['tier1', 'tier2', 'tier3', 'tier4']
          - not_null:
              name: customer_tier_null_bucket
              config:
                severity: warn

unit_tests:
  - name: customer_tier_preserves_legacy_boundaries
    description: >-
      Locks the original CASE precedence, inclusive endpoints, fractional gaps,
      negative values, and all-NULL order totals to their legacy outcomes.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
          - {customer_key: 5}
          - {customer_key: 6}
          - {customer_key: 7}
          - {customer_key: 8}
          - {customer_key: 9}
          - {customer_key: 10}
          - {customer_key: 11}
          - {customer_key: 12}
          - {customer_key: 13}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: -1}
          - {customer_key: 2, total_price: 0}
          - {customer_key: 3, total_price: 200000}
          - {customer_key: 4, total_price: 200000.01}
          - {customer_key: 5, total_price: 999999}
          - {customer_key: 6, total_price: 999999.01}
          - {customer_key: 7, total_price: 999999.99}
          - {customer_key: 8, total_price: 1000000}
          - {customer_key: 9, total_price: 1999999}
          - {customer_key: 10, total_price: 1999999.01}
          - {customer_key: 11, total_price: 2000000}
          - {customer_key: 12, total_price: 2000000.01}
          - {customer_key: 13, total_price: null}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: -1, tier_name: tier1}
        - {customer_key: 2, lifetime_value: 0, tier_name: tier1}
        - {customer_key: 3, lifetime_value: 200000, tier_name: tier1}
        - {customer_key: 4, lifetime_value: 200000.01, tier_name: tier4}
        - {customer_key: 5, lifetime_value: 999999, tier_name: tier4}
        - {customer_key: 6, lifetime_value: 999999.01, tier_name: null}
        - {customer_key: 7, lifetime_value: 999999.99, tier_name: null}
        - {customer_key: 8, lifetime_value: 1000000, tier_name: tier3}
        - {customer_key: 9, lifetime_value: 1999999, tier_name: tier3}
        - {customer_key: 10, lifetime_value: 1999999.01, tier_name: null}
        - {customer_key: 11, lifetime_value: 2000000, tier_name: null}
        - {customer_key: 12, lifetime_value: 2000000.01, tier_name: tier2}
        - {customer_key: 13, lifetime_value: null, tier_name: null}

  - name: customer_tier_aggregates_matching_orders_only
    description: >-
      Sums multiple orders before classification, ignores individual NULL prices,
      and excludes customers without orders and orders without customers.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: 150000}
          - {customer_key: 1, total_price: 150000}
          - {customer_key: 1, total_price: null}
          - {customer_key: 2, total_price: 1000000}
          - {customer_key: 2, total_price: 1000000}
          - {customer_key: 99, total_price: 500000}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: 300000, tier_name: tier4}
        - {customer_key: 2, lifetime_value: 2000000, tier_name: null}
