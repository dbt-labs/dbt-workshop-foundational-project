version: 2

models:
  - name: customer_tier
    description: >-
      Table rebuilt on each run, replacing retail_datamart.build_customer_tier.
      One row per customer with at least one matching order, using stg_customers
      and stg_orders in place of the procedure's stg_tpch_* inputs. Lifetime
      value sums total_price across all orders without date or status filters.
      The inner join excludes customers without orders and orders without a
      matching customer. Legacy CASE order and gaps are intentionally preserved
      for reporting parity; thresholds remain provisional pending Finance review.
      The table is created in the configured dbt target schema, not hardcoded
      to retail_datamart. A warning-level test monitors the legacy NULL bucket.
    columns:
      - name: customer_key
        description: Customer identifier from stg_customers; one row per key, stored as NUMBER(38, 0).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: lifetime_value
        description: >-
          Sum of matching order total_price, stored as NUMBER(38, 2). NULL
          prices are ignored by SUM; an all-NULL set remains NULL. Tier rules
          evaluate the sum before the output cast, matching the procedure.
      - name: tier_name
        description: >-
          First matching legacy rule wins: tier1 for values <= 200000 (including
          negatives); tier2 for values > 2000000; tier3 for 1000000 through
          1999999 inclusive; tier4 for the remaining values > 200000 through
          999999 inclusive. Values strictly between 999999 and 1000000,
          or > 1999999 through 2000000 inclusive, remain NULL, as do NULL
          lifetime values. NULL is intentional and monitored as a warning.
        data_tests:
          - accepted_values:
              arguments:
                values: ['tier1', 'tier2', 'tier3', 'tier4']
          - not_null:
              config:
                severity: warn

unit_tests:
  - name: customer_tier_preserves_legacy_boundaries
    description: >-
      Protect CASE precedence, negative and zero values, every tier boundary,
      fractional gaps, and the intentional NULL at exactly 2000000.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
          - {customer_key: 5}
          - {customer_key: 6}
          - {customer_key: 7}
          - {customer_key: 8}
          - {customer_key: 9}
          - {customer_key: 10}
          - {customer_key: 11}
          - {customer_key: 12}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: -0.01}
          - {customer_key: 2, total_price: 0}
          - {customer_key: 3, total_price: 200000}
          - {customer_key: 4, total_price: 200000.01}
          - {customer_key: 5, total_price: 999999}
          - {customer_key: 6, total_price: 999999.01}
          - {customer_key: 7, total_price: 999999.99}
          - {customer_key: 8, total_price: 1000000}
          - {customer_key: 9, total_price: 1999999}
          - {customer_key: 10, total_price: 1999999.01}
          - {customer_key: 11, total_price: 2000000}
          - {customer_key: 12, total_price: 2000000.01}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: -0.01, tier_name: tier1}
        - {customer_key: 2, lifetime_value: 0, tier_name: tier1}
        - {customer_key: 3, lifetime_value: 200000, tier_name: tier1}
        - {customer_key: 4, lifetime_value: 200000.01, tier_name: tier4}
        - {customer_key: 5, lifetime_value: 999999, tier_name: tier4}
        - {customer_key: 6, lifetime_value: 999999.01, tier_name: null}
        - {customer_key: 7, lifetime_value: 999999.99, tier_name: null}
        - {customer_key: 8, lifetime_value: 1000000, tier_name: tier3}
        - {customer_key: 9, lifetime_value: 1999999, tier_name: tier3}
        - {customer_key: 10, lifetime_value: 1999999.01, tier_name: null}
        - {customer_key: 11, lifetime_value: 2000000, tier_name: null}
        - {customer_key: 12, lifetime_value: 2000000.01, tier_name: tier2}

  - name: customer_tier_preserves_aggregation_and_inner_join
    description: >-
      Sum orders before tiering, ignore individual NULL prices, retain an
      all-NULL lifetime value, exclude customers without orders, and exclude
      orders whose customer is missing. No date or status filter applies.
    model: customer_tier
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_key: 1}
          - {customer_key: 2}
          - {customer_key: 3}
          - {customer_key: 4}
      - input: ref('stg_orders')
        rows:
          - {customer_key: 1, total_price: 100000, status_code: F}
          - {customer_key: 1, total_price: 150000, status_code: O}
          - {customer_key: 2, total_price: null, status_code: F}
          - {customer_key: 2, total_price: 100, status_code: O}
          - {customer_key: 3, total_price: null, status_code: O}
          - {customer_key: 99, total_price: 3000000, status_code: F}
    expect:
      rows:
        - {customer_key: 1, lifetime_value: 250000, tier_name: tier4}
        - {customer_key: 2, lifetime_value: 100, tier_name: tier1}
        - {customer_key: 3, lifetime_value: null, tier_name: null}
