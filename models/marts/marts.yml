version: 2

models:
  - name: fct_orders
    description: Order-level fact model with one row per order, enriched with customer attributes and rollups of line item sales amounts.
    columns:
      - name: order_key
        description: Primary key for the order.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: customer_key
        description: Customer key associated with the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: status_code
        description: Order status code inherited from `stg_orders`.
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']
      - name: priority_code
        description: Source order priority code.
      - name: ship_priority
        description: Shipping priority associated with the order.
      - name: clerk_name
        description: Clerk responsible for the order.
      - name: name
        description: Customer name from `stg_customers`.
      - name: market_segment
        description: Customer market segment from `stg_customers`.
      - name: gross_item_sales_amount
        description: Sum of gross line item sales for the order.
        data_tests:
          - not_null
      - name: item_discount_amount
        description: Sum of line item discount amounts for the order.
        data_tests:
          - not_null
      - name: item_tax_amount
        description: Sum of line item tax amounts for the order.
        data_tests:
          - not_null
      - name: net_item_sales_amount
        description: Sum of net line item sales amounts for the order.
        data_tests:
          - not_null

  - name: monthly_sales
    description: Monthly summary of order activity and sales amounts aggregated from `fct_orders`.
    columns:
      - name: order_month
        description: First day of the order month.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders placed in the month.
        data_tests:
          - not_null
      - name: customer_count
        description: Number of distinct customers with at least one order in the month.
        data_tests:
          - not_null
      - name: gross_sales_amount
        description: Sum of gross item sales for orders in the month.
        data_tests:
          - not_null
      - name: discount_amount
        description: Sum of item discount amounts for orders in the month.
        data_tests:
          - not_null
      - name: tax_amount
        description: Sum of item tax amounts for orders in the month.
        data_tests:
          - not_null
      - name: net_sales_amount
        description: Sum of net item sales for orders in the month.
        data_tests:
          - not_null
