version: 2

models:
  - name: fct_orders
    description: Order-level fact model with one row per order, enriched with customer attributes and rolled-up line item revenue, discount, tax, and net sales amounts.
    columns:
      - name: order_key
        description: Primary key for the order.
        data_tests:
          - unique
          - not_null
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: customer_key
        description: Foreign key to the customer who placed the order.
        data_tests:
          - not_null
      - name: status_code
        description: Order status code from the source system.
      - name: priority_code
        description: Order priority classification.
      - name: ship_priority
        description: Shipping priority value assigned to the order.
      - name: clerk_name
        description: Clerk associated with the order.
      - name: name
        description: Customer name associated with the order.
      - name: market_segment
        description: Customer market segment.
      - name: gross_item_sales_amount
        description: Sum of gross sales across all line items on the order before discounts and tax.
      - name: item_discount_amount
        description: Sum of discount amounts across all line items on the order.
      - name: item_tax_amount
        description: Sum of tax amounts across all line items on the order.
      - name: net_item_sales_amount
        description: Sum of net sales across all line items on the order after discounts and tax.

  - name: monthly_sales
    description: Monthly rollup of order activity and sales from `fct_orders`, with one row per calendar month.
    columns:
      - name: order_month
        description: First day of the calendar month represented by the row.
        data_tests:
          - unique
          - not_null
      - name: order_count
        description: Number of orders placed in the month.
      - name: customer_count
        description: Number of distinct customers who placed orders in the month.
      - name: gross_sales_amount
        description: Total gross sales amount across all orders in the month.
      - name: discount_amount
        description: Total discount amount across all orders in the month.
      - name: tax_amount
        description: Total tax amount across all orders in the month.
      - name: net_sales_amount
        description: Total net sales amount across all orders in the month.
      - name: avg_order_net_sales_amount
        description: Average net sales amount per order in the month.
