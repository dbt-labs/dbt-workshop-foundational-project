version: 2

models:
  - name: fct_orders
    description: "One record per order with customer attributes and rolled-up line item sales amounts."
    columns:
      - name: order_key
        description: "Primary key for the order."
        data_tests:
          - not_null
          - unique

      - name: order_date
        description: "The date the order was placed."
        data_tests:
          - not_null

      - name: customer_key
        description: "Foreign key to the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key


      - name: status_code
        description: "Status code for the order."

      - name: priority_code
        description: "Priority assigned to the order."

      - name: ship_priority
        description: "Shipping priority for the order."

      - name: clerk_name
        description: "Clerk associated with the order."

      - name: name
        description: "Customer name from the customer dimension."

      - name: market_segment
        description: "Customer market segment from the customer dimension."

      - name: gross_item_sales_amount
        description: "Sum of gross item sales amount across all line items in the order."
        data_tests:
          - not_null

      - name: item_discount_amount
        description: "Sum of item discount amount across all line items in the order."
        data_tests:
          - not_null

      - name: item_tax_amount
        description: "Sum of item tax amount across all line items in the order."
        data_tests:
          - not_null

      - name: net_item_sales_amount
        description: "Sum of net item sales amount across all line items in the order."
        data_tests:
          - not_null

  - name: monthly_sales
    description: "Monthly summary of order volume and sales amounts aggregated from `fct_orders` at the first day of each month."
    columns:
      - name: order_month
        description: "The month of the order, truncated to the first day of the month."
        data_tests:
          - not_null
          - unique

      - name: total_orders
        description: "The total number of orders placed in the month."
        data_tests:
          - not_null

      - name: gross_item_sales_amount
        description: "The sum of gross item sales amount across all orders in the month before discounts and tax."
        data_tests:
          - not_null

      - name: item_discount_amount
        description: "The sum of item discount amount across all orders in the month."
        data_tests:
          - not_null

      - name: item_tax_amount
        description: "The sum of item tax amount across all orders in the month."
        data_tests:
          - not_null

      - name: net_item_sales_amount
        description: "The sum of net item sales amount across all orders in the month after discounts and tax adjustments."
        data_tests:
          - not_null
