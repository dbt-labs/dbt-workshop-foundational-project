version: 2

models:
  - name: monthly_sales
    description: Monthly summary of order activity and sales amounts, with one row per order month.
    columns:
      - name: order_month
        description: First day of the month representing the reporting month for the aggregated orders.
        data_tests:
          - not_null
          - unique

      - name: order_count
        description: Number of distinct orders placed in the month.
        data_tests:
          - not_null

      - name: customer_count
        description: Number of distinct customers who placed an order in the month.
        data_tests:
          - not_null

      - name: gross_sales_amount
        description: Sum of gross item sales amount across all orders in the month.

      - name: discount_amount
        description: Sum of item discount amounts across all orders in the month.

      - name: tax_amount
        description: Sum of item tax amounts across all orders in the month.

      - name: net_sales_amount
        description: Sum of net item sales amount across all orders in the month.
