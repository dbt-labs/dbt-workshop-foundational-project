version: 2

models:
  - name: fct_orders
    description: One row per order with customer attributes and order-level sales amounts rolled up from line items.
    columns:
      - name: order_key
        description: Primary key for the order.
      - name: order_date
        description: Date the order was placed.
      - name: customer_key
        description: Foreign key to the customer who placed the order.
      - name: status_code
        description: Order status code from the source system.
      - name: priority_code
        description: Priority assigned to the order.
      - name: ship_priority
        description: Shipping priority value for the order.
      - name: clerk_name
        description: Clerk associated with the order.
      - name: name
        description: Customer name from the customer dimension.
      - name: market_segment
        description: Customer market segment.
      - name: gross_item_sales_amount
        description: Sum of gross sales across all line items on the order before discounts and tax.
      - name: item_discount_amount
        description: Sum of discount amounts across all line items on the order.
      - name: item_tax_amount
        description: Sum of tax amounts across all line items on the order.
      - name: net_item_sales_amount
        description: Sum of net sales across all line items on the order after discounts and tax.
