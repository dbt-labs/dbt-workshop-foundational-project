version: 2

models:
  - name: dim_customers
    description: >-
      Customer attributes enriched with nation and region names. Includes
      contact details, account balance, and market segment for customers with
      matching nation and region records.
  - name: fct_orders
    description: >-
      Order-level sales fact table combining order headers, customer names and
      market segments, and aggregated line-item gross sales, discounts, taxes,
      and net sales. Includes only orders with matching customers and line
      items; no order status filter is applied.
