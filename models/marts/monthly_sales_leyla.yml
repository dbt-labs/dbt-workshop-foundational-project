version: 2

models:
  - name: monthly_sales_leyla
    description: >
      Monthly gross item sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates orders present in
      fct_orders, which includes only orders with matching line items and customers.
      Includes all order statuses without filtering. Months and segments with no
      orders are omitted rather than filled with zeroes.
    columns:
      - name: order_month
        description: >
          Order date truncated to the first day of its calendar month. Together
          with market_segment, identifies a unique row.
        data_tests:
          - not_null
      - name: market_segment
        description: >
          Customer market segment from stg_customers, carried through fct_orders.
          Together with order_month, identifies a unique row.
        data_tests:
          - not_null
      - name: total_revenue
        description: >
          Sum of fct_orders.gross_item_sales_amount for the month and market
          segment. Represents gross line-item extended prices before discounts
          and tax, not net revenue.
        data_tests:
          - not_null

data_tests:
  - name: assert_monthly_sales_leyla_unique_grain
    description: >
      Ensures each month and market segment combination appears at most once.
      If this fails, inspect the model's grouping and any newly introduced joins.
  - name: assert_monthly_sales_leyla_month_start
    description: >
      Ensures order_month is aligned to the start of a calendar month.
      If this fails, inspect the order_date truncation in monthly_sales_leyla.
