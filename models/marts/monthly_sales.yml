version: 2

models:
  - name: monthly_sales
    description: Monthly gross revenue aggregated by customer market segment. The grain is one row per order month and market segment.
    columns:
      - name: order_month
        description: First day of the calendar month in which the order was placed.
        data_tests:
          - not_null

      - name: market_segment
        description: Customer market segment associated with the order.
        data_tests:
          - not_null

      - name: total_revenue
        description: Sum of gross item sales for orders placed in the month and market segment.
        data_tests:
          - not_null
