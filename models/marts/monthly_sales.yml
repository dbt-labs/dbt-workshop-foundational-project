version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales from fct_orders, with one row per calendar month
      and customer market segment. Includes orders with matching customers and
      line items, with no order status filter. Month-and-segment combinations
      without orders are omitted.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "(to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment)"
    columns:
      - name: order_month
        description: Order date truncated to the first day of the calendar month.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment from fct_orders used to group sales.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount for the month and market segment,
          before discounts and taxes, with no currency or unit conversion.
        data_tests:
          - not_null
