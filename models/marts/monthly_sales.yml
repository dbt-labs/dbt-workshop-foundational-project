models:
  - name: monthly_sales
    description: Monthly summary of order volume, customer activity, and sales amounts from `fct_orders`.
    columns:
      - name: order_month
        description: First day of the month for the aggregated order period.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders placed in the month.
      - name: customer_count
        description: Number of distinct customers with at least one order in the month.
      - name: gross_sales_amount
        description: Sum of gross item sales before discounts and taxes for the month.
      - name: discount_amount
        description: Sum of item discount amounts for the month.
      - name: tax_amount
        description: Sum of item tax amounts for the month.
      - name: net_sales_amount
        description: Sum of net item sales for the month.
