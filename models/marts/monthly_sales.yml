version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination present in fct_orders.
      Supports monthly sales trend and segment comparisons. Revenue is summed
      from gross item sales before discounts and tax; no order-status filter
      is applied. Inherits fct_orders' exclusion of orders without matching
      line items or customers. Months and segments without orders are not
      filled in with zero-valued rows.
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month.
          Together with market_segment, identifies a monthly sales row.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment from fct_orders, used to group monthly
          gross sales. Together with order_month, identifies a monthly sales row.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the calendar month
          and market segment, before discounts and tax. This represents gross
          sales, not net sales; the model does not perform currency conversion.
        data_tests:
          - not_null
