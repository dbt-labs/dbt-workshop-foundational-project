version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates gross item sales
      from fct_orders using the order date, before discounts and tax. Only
      month-and-segment combinations with orders are included; missing
      combinations are not filled with zero revenue.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date. Together
          with market_segment, identifies a row in this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment associated with the orders in fct_orders.
          Sales are grouped by this segment and the calendar month of the order.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment. Represents gross line-item sales before discounts
          and tax, rather than net sales. Uses the source monetary units;
          this model performs no currency conversion.
        data_tests:
          - not_null
