version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates
      gross_item_sales_amount from fct_orders using the order date to assign
      each order to a calendar month. Only month-segment combinations present
      in fct_orders are included; missing combinations are not filled with zeros.
      total_revenue represents gross item sales, not net sales.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_json(array_construct(order_month, market_segment))"
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date, calculated
          with DATE_TRUNC('month', order_date). Together with market_segment,
          identifies a row in this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment carried from fct_orders, where it is joined
          from the customer record. Together with order_month, identifies a row
          in this model.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount across orders in the calendar month
          and customer market segment. Uses the gross sales measure from
          fct_orders rather than its net_item_sales_amount measure.
        data_tests:
          - not_null
