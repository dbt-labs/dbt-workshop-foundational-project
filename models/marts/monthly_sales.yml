version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders. Each row represents one calendar month and market segment.
      Includes all order statuses present in fct_orders; only month and segment
      combinations with orders are returned, so missing combinations are not
      filled with zero revenue.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_varchar(order_month) || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date. Together
          with market_segment, uniquely identifies a row.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment carried through fct_orders from the customer
          record. Together with order_month, defines the aggregation grain.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the calendar month
          and market segment. Represents gross item sales before item discounts
          and taxes, rather than net sales.
        data_tests:
          - not_null
