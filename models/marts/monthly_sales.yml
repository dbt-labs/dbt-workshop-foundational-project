version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, with one row per
      order_month and market_segment combination present in fct_orders.
      Aggregates gross_item_sales_amount using the order date, with no additional
      order-status or date filters. Months and segments without orders are not
      zero-filled. The latest month may be incomplete.
    columns:
      - name: order_month
        description: >-
          Calendar month of the order date, truncated to the first day of the
          month. Together with market_segment, defines the row grain.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment carried from fct_orders. Together with
          order_month, defines the row grain.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the order month and
          customer market segment. This is a gross sales measure, not the
          net_item_sales_amount measure available in fct_orders.
        data_tests:
          - not_null

data_tests:
  - name: monthly_sales_unique_month_segment
    description: >-
      Ensures monthly_sales has at most one row per order_month and market_segment
      combination. If this fails, inspect the returned duplicate pairs and check
      for changes to the model's grouping or joins.
