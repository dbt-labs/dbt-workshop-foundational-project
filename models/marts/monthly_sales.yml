version: 2

models:
  - name: monthly_sales
    description: Monthly summary of order volume and sales amounts derived from `fct_orders` at one row per calendar month.
    columns:
      - name: order_month
        description: First day of the calendar month represented by the row.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders placed in the month.
      - name: customer_count
        description: Number of distinct customers with at least one order in the month.
      - name: gross_sales_amount
        description: Sum of gross item sales amount for orders in the month.
      - name: discount_amount
        description: Sum of item discount amount for orders in the month.
      - name: tax_amount
        description: Sum of item tax amount for orders in the month.
      - name: net_sales_amount
        description: Sum of net item sales amount for orders in the month.
