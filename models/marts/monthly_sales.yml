version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, with one row per
      order_month and market_segment combination present in fct_orders.
      Aggregates all order statuses included in fct_orders, using the customer
      market segment joined there. Months and segments without orders are not
      filled in. Revenue is before discounts and tax; it is not net sales.
    columns:
      - name: order_month
        description: >-
          Order date truncated to the start of its calendar month. Together
          with market_segment, identifies the row's grain.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment from fct_orders. Together with order_month,
          identifies the row's grain.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the month and customer
          market segment. Gross item sales originate from line-item extended
          prices and exclude the separately calculated discounts and tax.
          No currency conversion is applied by this model.
        data_tests:
          - not_null
