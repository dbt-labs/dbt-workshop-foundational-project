version: 2

models:
  - name: monthly_sales
    description: Monthly summary of order volume, customer activity, and sales amounts derived from `fct_orders`.
    columns:
      - name: order_month
        description: First day of the month represented by the summary row.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders placed in the month.
        data_tests:
          - not_null
      - name: customer_count
        description: Number of distinct customers with at least one order in the month.
      - name: gross_sales_amount
        description: Sum of gross item sales before discounts and tax for the month.
      - name: discount_amount
        description: Sum of item-level discount amounts for the month.
      - name: tax_amount
        description: Sum of item-level tax amounts for the month.
      - name: net_sales_amount
        description: Sum of net item sales after discounts and tax for the month.
