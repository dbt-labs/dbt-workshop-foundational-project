version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment. Aggregates gross_item_sales_amount from
      fct_orders across all order statuses, before discounts and tax. Only
      month/segment combinations with orders in fct_orders are included; missing
      combinations are not filled with zeroes. Use for gross sales trends,
      not net or recognized revenue.
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month. Together
          with market_segment, identifies a row in this model.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment joined onto the order in fct_orders. Together
          with order_month, defines the aggregation grain.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the month and customer
          market segment. The upstream amount is the line-item extended price
          before discounts and tax; no order-status filter is applied.
        data_tests:
          - not_null

data_tests:
  - name: monthly_sales_unique_grain
    description: >-
      Ensures each order_month and market_segment pair appears at most once.
      If this fails, check for changes to the aggregation grain or new joins
      that duplicate monthly totals.
  - name: monthly_sales_month_start
    description: >-
      Ensures order_month is aligned to the start of its calendar month.
      If this fails, check that order_date is still truncated to month in
      monthly_sales. Null months are checked separately by not_null.
