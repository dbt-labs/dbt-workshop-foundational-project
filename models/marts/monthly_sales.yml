version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, with one row per
      order month and market segment. Aggregates gross_item_sales_amount from
      fct_orders using order_date, with no order-status filter. Only month and
      segment combinations present in the input are included; missing
      combinations are not filled with zeroes.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date. Together
          with market_segment, identifies a row in this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment carried from fct_orders. Together with
          order_month, identifies a row in this model.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount for orders in the month and customer
          market segment, before item discounts and tax. This is gross item
          sales, not net revenue; no currency conversion is applied.
        data_tests:
          - not_null
