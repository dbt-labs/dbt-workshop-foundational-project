version: 2

models:
  - name: monthly_sales
    description: Monthly summary of order volume and sales amounts from fct_orders.
    columns:
      - name: order_month
        description: First day of the month for the aggregated orders.
        tests:
          - not_null
          - unique

      - name: order_count
        description: Number of orders in the month.

      - name: customer_count
        description: Number of distinct customers who placed orders in the month.

      - name: gross_sales_amount
        description: Sum of gross item sales before discounts and tax.

      - name: discount_amount
        description: Sum of item discount amounts, modeled as negative values.

      - name: tax_amount
        description: Sum of item tax amounts.

      - name: net_sales_amount
        description: Sum of net item sales after discounts and tax.

      - name: avg_order_net_sales_amount
        description: Average net sales amount per order in the month.
