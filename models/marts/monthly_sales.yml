version: 2

models:
  - name: monthly_sales
    description: Monthly order and sales summary aggregated from `fct_orders` at the month grain.
    columns:
      - name: order_month
        description: First day of the order month.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders in the month.
      - name: customer_count
        description: Number of distinct customers with orders in the month.
      - name: gross_sales_amount
        description: Sum of gross item sales amount for orders in the month.
      - name: discount_amount
        description: Sum of item discount amount for orders in the month.
      - name: tax_amount
        description: Sum of item tax amount for orders in the month.
      - name: net_sales_amount
        description: Sum of net item sales amount for orders in the month.
