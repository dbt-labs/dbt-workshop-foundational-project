version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, for sales trend
      reporting. One row per order_month and market_segment combination present
      in fct_orders; missing month/segment combinations are not filled with zeros.
      Includes all order statuses available in fct_orders, whose orders must have
      matching line items and customers.
    columns:
      - name: order_month
        description: >-
          Calendar month of the order, calculated by truncating order_date to
          the first day of the month. Used with market_segment to identify a row.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment supplied by fct_orders. Used with order_month
          to identify a row; the model does not impose a fixed list of segments.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the month and segment.
          Represents gross item sales, not net sales; no discount or tax
          adjustment is applied by this model. No currency conversion is applied.
        data_tests:
          - not_null
