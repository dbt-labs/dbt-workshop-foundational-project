version: 2

models:
  - name: monthly_sales
    description: >
      Monthly gross item revenue by customer market segment. One row per
      order_month and market_segment; use this mart for segment-level revenue
      trending rather than order-level analysis.
    columns:
      - name: order_month
        description: First calendar day of the month in which the order was placed.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment associated with the order.
        data_tests:
          - not_null
      - name: total_revenue
        description: Sum of gross item sales for orders in the month and market segment, before discounts and taxes.
        data_tests:
          - not_null
