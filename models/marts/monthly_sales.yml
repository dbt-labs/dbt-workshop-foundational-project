version: 2

models:
  - name: monthly_sales
    description: Monthly summary of orders and sales metrics aggregated from `fct_orders`.
    columns:
      - name: order_month
        description: First day of the month for the aggregated order period.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders placed in the month.
      - name: customer_count
        description: Number of distinct customers with at least one order in the month.
      - name: gross_sales_amount
        description: Sum of gross item sales before discounts and tax.
      - name: discount_amount
        description: Sum of discount amounts applied in the month.
      - name: tax_amount
        description: Sum of tax amounts in the month.
      - name: net_sales_amount
        description: Sum of net item sales after discounts and tax.
