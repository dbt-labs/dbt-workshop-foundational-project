version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates fct_orders using
      the order date and the customer's market segment. Only month/segment
      combinations with orders are included; missing months are not filled in.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          Order date truncated to the start of its calendar month. Together
          with market_segment, defines the grain of this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment from fct_orders, used to group gross sales
          within each calendar month.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment. This is gross item sales before item discounts and
          excludes the separately tracked item tax amount; it is not net sales.
          Values retain the upstream amount units without currency conversion.
        data_tests:
          - not_null
