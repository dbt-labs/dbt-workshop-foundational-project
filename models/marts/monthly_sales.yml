version: 2

models:
  - name: monthly_sales
    description: Monthly rollup of order activity and sales amounts from `fct_orders`.
    columns:
      - name: order_month
        description: First day of the month representing the reporting period.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders in the month.
        data_tests:
          - not_null
      - name: customer_count
        description: Number of distinct customers who placed orders in the month.
        data_tests:
          - not_null
      - name: gross_sales_amount
        description: Sum of gross item sales before discounts and tax for the month.
      - name: discount_amount
        description: Sum of item-level discounts for the month.
      - name: tax_amount
        description: Sum of item-level tax for the month.
      - name: net_sales_amount
        description: Sum of net item sales for the month.
