version: 2

models:
  - name: fct_orders
    description: Order-level fact table with one row per order and customer attributes joined to aggregated line-item sales amounts.
    columns:
      - name: order_key
        description: Primary key for the order.
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: Date the order was placed.
      - name: customer_key
        description: Foreign key to the customer that placed the order.
      - name: status_code
        description: Order lifecycle status code inherited from staging.
      - name: priority_code
        description: Source order priority classification.
      - name: ship_priority
        description: Shipping priority value assigned to the order.
      - name: clerk_name
        description: Clerk identifier associated with the order.
      - name: name
        description: Customer name joined from `stg_customers`.
      - name: market_segment
        description: Customer market segment joined from `stg_customers`.
      - name: gross_item_sales_amount
        description: Sum of gross line-item sales amounts for the order before discounts and tax.
      - name: item_discount_amount
        description: Sum of line-item discount amounts for the order, stored as negative values.
      - name: item_tax_amount
        description: Sum of line-item tax amounts for the order.
      - name: net_item_sales_amount
        description: Sum of line-item sales amounts for the order after discounts and tax.

  - name: dim_customers
    description: Customer dimension enriched with nation and region attributes, with one row per customer.
    columns:
      - name: customer_key
        description: Primary key for the customer.
        data_tests:
          - not_null
          - unique
      - name: name
        description: Customer name from the source system.
      - name: address
        description: Customer street address.
      - name: nation
        description: Nation associated with the customer.
      - name: region
        description: Region associated with the customer's nation.
      - name: phone_number
        description: Customer phone number.
      - name: account_balance
        description: Current customer account balance from the source system.
      - name: market_segment
        description: Source market segment used to group customers for analysis.

  - name: monthly_sales
    description: Monthly order and sales summary aggregated from `fct_orders` at the month grain.
    columns:
      - name: order_month
        description: First day of the order month.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders in the month.
      - name: customer_count
        description: Number of distinct customers with orders in the month.
      - name: gross_sales_amount
        description: Sum of gross item sales amount for orders in the month.
      - name: discount_amount
        description: Sum of item discount amount for orders in the month.
      - name: tax_amount
        description: Sum of item tax amount for orders in the month.
      - name: net_sales_amount
        description: Sum of net item sales amount for orders in the month.
