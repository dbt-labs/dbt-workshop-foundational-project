version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per order
      month and market segment present in fct_orders. Aggregates all order
      statuses using order_date; months or segments with no orders are not
      filled in. The latest month may be incomplete.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "(to_varchar(order_month, 'YYYY-MM') || '|' || market_segment)"
    columns:
      - name: order_month
        description: >-
          Calendar month of the order, derived by truncating order_date to the
          first day of the month. Part of the month-and-market-segment key.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment joined onto the order in fct_orders.
          Part of the month-and-market-segment key.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount for orders in this month and market
          segment. Based on line-item extended prices before discounts and
          taxes; this is gross sales, not net revenue. No order-status or
          return-status filter is applied.
        data_tests:
          - not_null
