version: 2

models:
  - name: monthly_sales
    description: Monthly gross item sales summarized by customer market segment. Each row represents one order month and market segment combination.
    columns:
      - name: order_month
        description: First day of the calendar month containing the order date, used as the reporting period.
        data_tests:
          - not_null

      - name: market_segment
        description: Customer market segment associated with the order.
        data_tests:
          - not_null

      - name: total_revenue
        description: Sum of gross item sales for orders in the reporting month and market segment, before item-level discounts and taxes.
        data_tests:
          - not_null
