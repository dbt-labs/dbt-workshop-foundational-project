version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders. Each row represents one calendar month and market segment.
      Only month/segment combinations present in fct_orders are included;
      missing combinations are not filled with zeroes.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_json(array_construct(order_month, market_segment))"
    columns:
      - name: order_month
        description: >-
          Calendar month of the order, derived by truncating fct_orders.order_date
          to the first day of the month. Together with market_segment, defines
          the grain of this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment from fct_orders, assigned through its join to
          stg_customers. Together with order_month, identifies a monthly sales row.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the calendar month and
          customer market segment. Represents gross item sales, not net sales;
          item discounts and item tax amounts are separate upstream measures
          and are not applied in this calculation.
        data_tests:
          - not_null
