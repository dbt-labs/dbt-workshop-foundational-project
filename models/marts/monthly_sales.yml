version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination present in fct_orders.
      Sums gross item sales before discounts and tax across all order statuses;
      months and segments without orders are not filled in with zeroes.
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month.
          Together with market_segment, defines the grain of this model.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment supplied by fct_orders through its customer
          join. Together with order_month, defines the grain of this model.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']
              config:
                severity: warn
              description: >-
                Flags new or mis-cased segments coming from stg_customers.c_mktsegment.
                A new segment isn't necessarily wrong, so this warns; confirm with the
                business and add it to the list.

      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the calendar month and
          customer market segment. Represents gross item sales before discounts
          and tax, not net revenue. No order-status filter is applied.
        data_tests:
          - not_null
