version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates all orders available
      in fct_orders, which includes only orders with matching line items and
      customers. Uses order date and applies no order-status or return-status
      filter. Month and segment combinations without orders are omitted rather
      than filled with zeroes.
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date, calculated
          with DATE_TRUNC('month', order_date). Together with market_segment,
          defines the grain of this model.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment from fct_orders, originally sourced from the
          customer's c_mktsegment value. Together with order_month, defines the
          grain of this model.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount across orders in the month and customer
          market segment. Represents gross line-item extended prices before
          discounts and tax, not net revenue. Values retain the source monetary
          units; this model performs no currency conversion.
        data_tests:
          - not_null

data_tests:
  - name: assert_monthly_sales_unique_grain
    description: >-
      Ensures each order_month and market_segment combination occurs only once.
      If this fails, inspect changes to the monthly_sales grouping or any joins
      added after aggregation before relying on downstream revenue totals.
