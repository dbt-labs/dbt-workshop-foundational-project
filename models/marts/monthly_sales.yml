version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders using the order date. Each row represents one calendar month
      and market segment. Includes all orders present in fct_orders, without
      an additional order-status filter. Month-segment combinations without
      orders are omitted rather than filled with zero revenue.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month.
          Together with market_segment, defines the grain of this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment carried through from fct_orders.
          Together with order_month, identifies a monthly sales aggregate.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the calendar
          month and market segment. Represents gross item sales rather
          than net item sales; no additional discount or tax adjustment
          is applied by this model.
        data_tests:
          - not_null
