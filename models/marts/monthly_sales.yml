version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates all orders present
      in fct_orders without filtering order status. Only month/segment
      combinations with orders are included; missing combinations are not
      filled with zeros. The latest month may be incomplete.
    columns:
      - name: order_month
        description: >-
          Order date truncated to the start of its calendar month. Together
          with market_segment, identifies a row in this model.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment carried from fct_orders, used to break down
          monthly gross sales. Together with order_month, identifies a row.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the month and market
          segment. Represents gross line-item extended prices before discounts
          and tax, not net revenue. Currency is inherited from the source data;
          this model performs no currency conversion.
        data_tests:
          - not_null

data_tests:
  - name: monthly_sales_unique_month_segment
    description: >-
      Ensures the model has at most one row per calendar month and market
      segment. If it fails, inspect changes to the aggregation grain or joins.
  - name: monthly_sales_order_month_is_month_start
    description: >-
      Ensures order_month is truncated to the calendar month boundary. If it
      fails, inspect the date truncation in monthly_sales.
