version: 2

models:
  - name: monthly_sales
    description: Monthly summary of order activity and sales based on `fct_orders`.
    columns:
      - name: order_month
        description: First day of the month for the aggregated order cohort.
        data_tests:
          - not_null
          - unique
      - name: order_count
        description: Number of orders placed in the month.
      - name: customer_count
        description: Number of distinct customers with orders in the month.
      - name: gross_sales_amount
        description: Sum of gross item sales before discounts and tax.
      - name: discount_amount
        description: Sum of item-level discount amounts in the month.
      - name: tax_amount
        description: Sum of item-level tax amounts in the month.
      - name: net_sales_amount
        description: Sum of net item sales after discounts and before tax treatment implied by `fct_orders`.
