version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates fct_orders using
      the order date; only month/segment combinations with orders are included.
      Revenue is gross item sales before item discounts and taxes, rather than
      net sales. No order-status filter is applied, and the current month may
      be incomplete.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          description: Ensures each month and market segment combination appears only once.
          arguments:
            column_name: "to_json(array_construct(order_month, market_segment))"
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month. Together
          with market_segment, defines the grain of this model.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment from fct_orders, joined from stg_customers.
          Sales are grouped by this segment and the order's calendar month.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment. This is gross item sales before item discounts and
          taxes; no currency conversion is performed by this model.
        data_tests:
          - not_null
