version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders using the order date. The grain is one row per calendar month
      and market segment. Only month/segment combinations with orders are
      included; missing combinations are not filled with zeroes.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          description: Each calendar month and market segment must appear at most once.
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
      - accepted_values:
          name: monthly_sales_month_starts_on_first_day
          description: The monthly reporting date must be the first day of its month.
          arguments:
            column_name: "extract(day from order_month)"
            values: [1]
            quote: false
    columns:
      - name: order_month
        description: Calendar month of the order, represented by its first day using date_trunc.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment from fct_orders, used to break down monthly sales.
        data_tests:
          - not_null
      - name: gross_item_sales_amount
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment, before item discounts and taxes.
        data_tests:
          - not_null
