version: 2

models:
  - name: dim_customers
    description: One row per customer enriched with nation and region attributes for mart consumption.
    columns:
      - name: customer_key
        description: Primary key for the customer.
        data_tests:
          - not_null
          - unique

      - name: name
        description: Customer name.

      - name: address
        description: Customer address.

      - name: nation
        description: Customer nation name.

      - name: region
        description: Customer region name.

      - name: phone_number
        description: Customer phone number.

      - name: account_balance
        description: Current customer account balance.

      - name: market_segment
        description: Customer market segment.
