models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment. Each row represents one
      calendar month and market segment, using orders with matching line items
      and customers from `fct_orders`.
    data_tests:
      - unique:
          name: unique_monthly_sales_grain
          arguments:
            column_name: "(order_month || '|' || market_segment)"
    columns:
      - name: order_month
        description: The first day of the calendar month in which the order was placed.
        data_tests:
          - not_null
      - name: market_segment
        description: The market segment assigned to the customer who placed the order.
        data_tests:
          - not_null
      - name: total_revenue
        description: Gross line-item sales amount summed for the month and market segment, before discounts and tax.
        data_tests:
          - not_null
