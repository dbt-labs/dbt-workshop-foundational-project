version: 2

models:
  - name: montly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates orders from
      fct_orders using the order date to assign each order to a calendar month.
      Only month and segment combinations with orders are included; missing
      combinations are not filled with zeroes. Revenue uses gross item sales,
      not net item sales.
    data_tests:
      - unique:
          name: montly_sales_unique_month_segment
          arguments:
            column_name: "(cast(order_month as varchar) || '|' || market_segment)"
    columns:
      - name: order_month
        description: >-
          Calendar month of the order date, truncated to the first day of the
          month with DATE_TRUNC('month', order_date). Together with
          market_segment, defines the row grain.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment carried through from fct_orders. Splits
          monthly gross sales into customer segments and forms the row grain
          together with order_month.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the calendar month and
          customer market segment. This is a gross sales measure rather than
          the sum of net_item_sales_amount.
        data_tests:
          - not_null
