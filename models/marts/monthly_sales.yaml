version: 2

models:
  - name: monthly_sales
    description: >
      Monthly gross line-item revenue by customer market segment. The model has one row
      per calendar month and market segment, using revenue before discounts and tax from
      orders that have matching customer and line-item records.
    columns:
      - name: order_month
        description: Calendar month in which the order was placed, truncated to the first day of the month.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment associated with the order.
        data_tests:
          - not_null
      - name: total_revenue
        description: Sum of gross line-item sales for orders in the month and market segment, before discounts and tax.
        data_tests:
          - not_null