version: 2

models:
  - name: fct_orders
    description: >-
      Order-level sales fact table, with one row per order_key, combining
      staged order headers and customer attributes with aggregated line-item
      gross sales, discounts, taxes, and net sales. Net sales include tax,
      and discounts are negative amounts. Inner joins retain only orders
      with matching line-item totals and a matching customer.

  - name: dim_customers
    description: >-
      Customer dimension, with one row per customer_key, containing customer
      name, address, phone number, account balance, and market segment,
      enriched with nation and region names. Inner joins retain only
      customers with a matching nation and a matching region.
