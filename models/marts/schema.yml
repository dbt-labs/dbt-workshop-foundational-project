version: 2

models:
  - name: fct_orders
    description: >-
      One row per order with customer attributes and summed line-item sales.
      Inner joins retain only orders with matching customers and line items.
      Gross sales exclude discount and tax; discount amounts are negative and
      net sales include both discount and tax. Currency is unspecified.
    columns:
      - name: order_key
        description: Unique order identifier after aggregating its lines.
        data_tests: [unique, not_null]
      - name: order_date
        description: Date the order was placed.
      - name: customer_key
        description: Customer placing the order.
      - name: status_code
        description: Source order status code.
      - name: priority_code
        description: Source order processing priority label.
      - name: ship_priority
        description: Numeric source shipping priority.
      - name: clerk_name
        description: Identifier of the clerk assigned to the order.
      - name: name
        description: Name of the customer placing the order.
      - name: market_segment
        description: Market segment of the customer placing the order.
      - name: gross_item_sales_amount
        description: Sum of gross line amounts before discount and tax for the order.
      - name: item_discount_amount
        description: Sum of negative line discount amounts for the order.
      - name: item_tax_amount
        description: Sum of tax amounts on discounted lines for the order.
      - name: net_item_sales_amount
        description: Sum of line amounts after discount and tax for the order.

  - name: monthly_sales
    description: >-
      One row per order month and customer market segment. Aggregates gross sales
      from fct_orders; despite its total_revenue name, this measure is before
      discounts and tax and should not be interpreted as net revenue. The existing
      assert_monthly_sales_unique_grain test protects the composite grain.
    columns:
      - name: order_month
        description: First day of the order month, derived by truncating order_date.
        data_tests: [not_null]
      - name: market_segment
        description: Customer market segment used to group orders.
      - name: total_revenue
        description: Sum of gross_item_sales_amount for the month and segment, before discounts and tax.
