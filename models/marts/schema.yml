version: 2

models:
  - name: fct_orders
    description: >-
      One row per order with customer attributes and summed line-item sales.
      Inner joins retain only orders with both a matching customer and at least
      one line item. Includes every order status. Monetary amounts are sums of
      the staged line-item amounts; source order total_price is not used.
    columns:
      - name: order_key
        description: Primary key of the order after joining customers and aggregated line items.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_key
      - name: order_date
        description: Order placement date from stg_orders, used to assign calendar sales months.
      - name: customer_key
        description: Customer identifier associated with this order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: status_code
        description: Order status code from stg_orders; no statuses are excluded.
      - name: priority_code
        description: Order priority classification from stg_orders.
      - name: ship_priority
        description: Shipping priority value from stg_orders.
      - name: clerk_name
        description: Clerk assigned to the order in stg_orders.
      - name: name
        description: Customer name joined from stg_customers.
      - name: market_segment
        description: Customer segment joined from stg_customers and used in monthly sales reporting.
      - name: gross_item_sales_amount
        description: Sum of gross extended line prices for the order, before discounts and tax.
      - name: item_discount_amount
        description: Sum of negative line-item discount amounts for the order.
      - name: item_tax_amount
        description: Sum of line-item tax amounts calculated after discounts.
      - name: net_item_sales_amount
        description: Sum of net line-item amounts, equal to gross sales plus negative discounts plus tax.

  - name: monthly_sales
    description: >-
      One row per calendar order month and customer market segment, aggregating
      fct_orders across all order statuses. Only month/segment combinations with
      contributing orders are present; missing months are not filled with zeros.
      Revenue is gross line-item sales before discounts and tax.
    columns:
      - name: order_month
        description: Order date truncated to the first day of its calendar month; part of the composite grain.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment; part of the composite grain with order_month.
      - name: total_revenue
        description: Sum of fct_orders.gross_item_sales_amount for the month and segment, before discounts and tax.
        data_tests:
          - not_null
