version: 2

models:
  - name: dim_customers
    description: >-
      One row per customer with matching nation and region records. Inner joins
      exclude customers without a matching geographic mapping. Includes customer
      attributes and source account balances for customer and geographic analysis.
    columns:
      - name: customer_key
        description: Customer identifier and primary key after geographic enrichment.
        data_tests: [unique, not_null]
      - name: name
        description: Customer name from stg_customers.
      - name: address
        description: Customer street address from stg_customers.
      - name: nation
        description: Nation name resolved through the customer's nation_key.
      - name: region
        description: Region name resolved through the nation's region_key.
      - name: phone_number
        description: Source customer phone number, retained as text.
      - name: account_balance
        description: Unadjusted source customer account balance; negative balances are retained.
      - name: market_segment
        description: Source customer market segment used for sales segmentation.

  - name: fct_orders
    description: >-
      One row per order with at least one line item and a matching customer.
      Inner joins exclude orders missing either. Aggregates line-item gross sales,
      signed discounts, tax, and tax-inclusive net sales to order grain and adds
      customer name and market segment. Includes all source order statuses.
    columns:
      - name: order_key
        description: Order identifier and primary key after line-item aggregation and customer enrichment.
        data_tests: [unique, not_null]
      - name: order_date
        description: Source order placement date used by monthly sales reporting.
      - name: customer_key
        description: Customer placing the order; must resolve to the enriched customer dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: status_code
        description: Source order status code; orders are not filtered by status.
      - name: priority_code
        description: Source order priority label.
      - name: ship_priority
        description: Source shipping priority value.
      - name: clerk_name
        description: Source identifier for the clerk associated with the order.
      - name: name
        description: Customer name from stg_customers, joined by customer_key.
      - name: market_segment
        description: Customer market segment from stg_customers, used for monthly sales grouping.
      - name: gross_item_sales_amount
        description: Sum of extended line prices for the order before discounts and tax.
      - name: item_discount_amount
        description: Sum of signed line-item discounts; discounts are represented as negative amounts.
      - name: item_tax_amount
        description: Sum of line-item tax calculated on discounted sales amounts.
      - name: net_item_sales_amount
        description: Sum of line-item gross sales plus signed discounts and tax; includes tax.
