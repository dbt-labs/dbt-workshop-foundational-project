version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension with one row per customer_key, enriched with nation
      and region names for geographic and market-segment reporting. Includes
      customer contact details and account balance. Inner joins retain only
      customers with matching nation and region records; no order is required.

  - name: fct_orders
    description: >-
      Order-level sales fact table with one row per order_key, combining order
      attributes and customer market segment with aggregated line-item gross
      sales, discounts, tax, and net sales. Discounts are negative amounts and
      net sales include tax. Inner joins retain only orders with matching
      line items and customers; order status is not filtered.
