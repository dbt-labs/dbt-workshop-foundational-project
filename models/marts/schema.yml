version: 2

models:
  - name: dim_customer
    description: >-
      Customer dimension at one row per customer_key, combining stg_customers
      with nation and region names from stg_nations and stg_regions. Includes
      contact details, account balance, and market segment. Inner joins retain
      only customers with matching nation and region records; an order is not
      required for a customer to be included.
    columns:
      - name: customer_key
        description: "Customer identifier from stg_customers; identifies one row in this dimension."
      - name: name
        description: "Customer name from the TPCH customer source."
      - name: address
        description: "Customer address as recorded in the TPCH customer source."
      - name: nation
        description: "Customer nation name, joined through the customer's nation_key."
      - name: region
        description: "Region name associated with the customer's nation."
      - name: phone_number
        description: "Customer phone number as recorded in the source."
      - name: account_balance
        description: "Customer account balance from the source, without currency conversion."
      - name: market_segment
        description: "Customer market segment from stg_customers."

  - name: fct_orders
    description: >-
      Order fact table at one row per order_key, combining order headers from
      stg_orders with customer names and market segments from stg_customers.
      Aggregates stg_line_items to order-level gross sales, negative discounts,
      tax, and net sales including tax. Inner joins retain only orders with
      both a matching customer and at least one line item.
    columns:
      - name: order_key
        description: "Order identifier from stg_orders; identifies one row in this fact table."
      - name: order_date
        description: "Date the order was placed, carried from stg_orders."
      - name: customer_key
        description: "Identifier of the customer who placed the order; joins to stg_customers.customer_key."
      - name: status_code
        description: "Order status code from the TPCH orders source."
      - name: priority_code
        description: "Order priority code from the TPCH orders source."
      - name: ship_priority
        description: "Shipping priority value from the order header."
      - name: clerk_name
        description: "Clerk identifier or name recorded on the order header."
      - name: name
        description: "Name of the customer who placed the order, from stg_customers."
      - name: market_segment
        description: "Market segment of the customer who placed the order."
      - name: gross_item_sales_amount
        description: "Sum of line-item extended prices for the order, before discounts and tax."
      - name: item_discount_amount
        description: "Sum of line-item discount amounts for the order; discounts are modeled as negative amounts."
      - name: item_tax_amount
        description: "Sum of line-item tax amounts for the order, calculated on sales after discounts."
      - name: net_item_sales_amount
        description: "Sum of line-item gross sales plus negative discounts plus tax for the order."
