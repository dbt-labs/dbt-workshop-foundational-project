version: 2

models:
  - name: dim_customer
    description: >-
      Customer dimension for segmentation and geographic reporting, with one
      row per customer that has matching nation and region records. Enriches
      staged customers with nation and region names while retaining contact
      details, account balance, and market segment.

  - name: fct_orders
    description: >-
      Order-level sales fact table, with one row per order that has both line
      items and a matching customer. Aggregates gross sales, negative discount
      amounts, tax, and net sales from line items and adds order attributes,
      customer name, and market segment. Net sales include discounts and tax.

  - name: assert_net_item_sales_amount_positive
    description: >-
      Validation model returning one row per order whose summed net item sales
      amount in fct_orders is negative. The amount column contains that sum;
      zero amounts are allowed. An empty result indicates that no negative
      order-level net sales amounts were found.
