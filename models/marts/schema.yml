version: 2

models:
  - name: fct_orders
    description: >
      One row per order with line-item sales totals and customer attributes.
      Inner joins retain only orders with at least one line item and a matching
      customer. All source order statuses are included; returns are not filtered.
    columns:
      - name: order_key
        description: Unique order identifier; joins to stg_orders.
        data_tests:
          - unique
          - not_null
      - name: order_date
        description: Source order date used for calendar-month sales reporting.
      - name: customer_key
        description: Identifier of the matching customer from stg_customers.
      - name: status_code
        description: Untranslated order status code from stg_orders.
      - name: priority_code
        description: Source order priority label.
      - name: ship_priority
        description: Source shipping priority code.
      - name: clerk_name
        description: Source identifier of the clerk responsible for the order.
      - name: name
        description: Customer name from stg_customers; this is not an order name.
      - name: market_segment
        description: Customer market segment from stg_customers, used for sales reporting.
      - name: gross_item_sales_amount
        description: Sum of extended line prices for the order before discounts and tax.
      - name: item_discount_amount
        description: Sum of rounded line-level discount amounts, represented as negative amounts.
      - name: item_tax_amount
        description: Sum of rounded line-level tax amounts calculated after discounts.
      - name: net_item_sales_amount
        description: Sum of rounded line-level gross sales plus discounts and tax; may differ from source total_price.

  - name: monthly_sales
    description: >
      One row per calendar month and customer market segment, aggregated from
      fct_orders by order date. total_revenue represents gross sales before
      discounts and tax, across all order statuses and return flags. Months and
      segments without orders have no row. Grain is checked by
      assert_monthly_sales_grain.
    columns:
      - name: order_month
        description: First day of the calendar month containing order_date.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment; combines with order_month to define the row grain.
      - name: total_revenue
        description: Sum of gross_item_sales_amount for the month and segment, before discounts and tax; not net revenue.
