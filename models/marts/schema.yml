version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension with one row per customer_key, combining customer
      contact details, account balance, and market segment with nation and
      region names. Includes only customers with matching nation and region
      records in the staging models.

  - name: fct_orders
    description: >-
      Order fact table with one row per order_key, combining order details
      with customer name and market segment and line-item totals for gross
      sales, discounts, tax, and net sales. Discount amounts are negative and
      net sales include discounts and tax. Includes only orders with matching
      customer and line-item records, across all order statuses.
