version: 2

models:
  - name: dim_customers
    description: >-
      Customer dimension with one row per customer_key, enriched with nation
      and region names. Includes customer contact information, account balance,
      and market segment. Inner joins retain only customers whose nation and
      region have matching reference records.

  - name: fct_orders
    description: >-
      Order fact table with one row per order_key, combining order headers,
      customer name and market segment, and sales amounts aggregated from
      order line items. Includes gross sales before discounts and tax,
      negative discount amounts, tax amounts, and net sales including discounts
      and tax. Inner joins retain only orders with matching line items and
      customer records; no order status filter is applied.
