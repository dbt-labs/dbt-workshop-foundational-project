version: 2

models:
  - name: fct_orders
    description: >-
      Order-level sales fact combining stg_orders with line-item amounts
      aggregated by order_key and customer attributes from stg_customers.
      Includes gross sales, negative discount amounts, tax, and net sales
      including tax, plus the customer's name and market segment. Inner joins
      exclude orders without matching line items or a matching customer.
      No order-status filter is applied.
  - name: dim_customers
    description: >-
      Customer dimension combining stg_customers with nation and region names
      from stg_nations and stg_regions. Contains customer identifiers, contact
      details, account balance, market segment, and geography, at the customer_key
      grain. Inner joins exclude customers without matching nation or region
      reference records.
