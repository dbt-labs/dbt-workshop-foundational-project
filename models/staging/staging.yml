version: 2

models:
  - name: stg_customers
    description: Staged customer dimension source with cleaned column names.
    columns:
      - name: customer_key
        description: Primary key for the customer.
        data_tests:
          - not_null
          - unique
      - name: nation_key
        description: Foreign key to the customer's nation.

  - name: stg_orders
    description: Staged order source with cleaned column names at one row per order.
    columns:
      - name: order_key
        description: Primary key for the order.
        data_tests:
          - not_null
          - unique
      - name: customer_key
        description: Foreign key to the customer who placed the order.
        data_tests:
          - not_null

  - name: stg_line_items
    description: Staged line item source with pricing and discount calculations at one row per order line.
    columns:
      - name: order_key
        description: Foreign key to the order.
        data_tests:
          - not_null
      - name: part_key
        description: Foreign key to the part on the line item.
        data_tests:
          - not_null
      - name: supplier_key
        description: Foreign key to the supplier on the line item.
        data_tests:
          - not_null
      - name: line_number
        description: Line number within the order.
        data_tests:
          - not_null
      - name: gross_item_sales_amount
        description: Gross line item sales amount before discounts and tax.
        data_tests:
          - not_null
      - name: net_item_sales_amount
        description: Net line item sales amount after discounts and tax.
        data_tests:
          - not_null

  - name: stg_nations
    description: Staged nation source with cleaned column names.
    columns:
      - name: nation_key
        description: Primary key for the nation.
        data_tests:
          - not_null
          - unique
      - name: region_key
        description: Foreign key to the region.
        data_tests:
          - not_null

  - name: stg_parts
    description: Staged part source with cleaned column names.
    columns:
      - name: part_key
        description: Primary key for the part.
        data_tests:
          - not_null
          - unique

  - name: stg_part_suppliers
    description: Staged part-supplier bridge source with cleaned column names.
    columns:
      - name: part_key
        description: Foreign key to the part.
        data_tests:
          - not_null
      - name: supplier_key
        description: Foreign key to the supplier.
        data_tests:
          - not_null
      - name: available_quantity
        description: Available quantity the supplier can provide for the part.

  - name: stg_regions
    description: Staged region source with cleaned column names.
    columns:
      - name: region_key
        description: Primary key for the region.
        data_tests:
          - not_null
          - unique

  - name: stg_suppliers
    description: Staged supplier source with cleaned column names.
    columns:
      - name: supplier_key
        description: Primary key for the supplier.
        data_tests:
          - not_null
          - unique
      - name: nation_key
        description: Foreign key to the supplier's nation.
        data_tests:
          - not_null
