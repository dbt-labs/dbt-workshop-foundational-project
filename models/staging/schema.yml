version: 2

models:
  - name: stg_customers
    description: >-
      Customer records from the TPCH customer source, with one row per
      customer_key. Standardizes customer identifiers, contact information,
      nation, account balance, and market segment for downstream models.

  - name: stg_line_items
    description: >-
      Order line items from the TPCH lineitem source, with one row per
      order_key and line_number combination. Standardizes product, supplier,
      shipping, and quantity fields and calculates unit prices, discounts,
      tax, and net sales. Discount amounts are represented as negative values;
      net sales include discounts and tax.

  - name: stg_nations
    description: >-
      Nation reference data from the TPCH nation source, with one row per
      nation_key. Provides the nation name and its region_key for enriching
      customer geography.

  - name: stg_orders
    description: >-
      Order header records from the TPCH orders source, with one row per
      order_key. Standardizes customer identifiers, order date, status,
      total price, clerk, and order and shipping priorities.

  - name: stg_regions
    description: >-
      Region reference data from the TPCH region source, with one row per
      region_key. Provides region names and source comments for geographic
      enrichment through nations.
