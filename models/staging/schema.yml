version: 2

models:
  - name: stg_line_items
    description: >-
      Order line items from the TPCH lineitem source, at the grain of an order
      and line number. Renames source columns and calculates unit prices,
      discounted sales, negative discount amounts, tax on discounted sales,
      and net sales including tax.

  - name: stg_regions
    description: >-
      Geographic regions from the TPCH region source, with one row per
      region key. Provides standardized region names and source comments
      for enriching nation and customer records.

  - name: stg_customers
    description: >-
      Customers from the TPCH customer source, with one row per customer key.
      Standardizes column names for customer contact details, nation key,
      account balance, market segment, and source comments.

  - name: stg_orders
    description: >-
      Order headers from the TPCH orders source, with one row per order key.
      Standardizes column names for the customer key, order date, status,
      total price, clerk, order and shipping priorities, and source comments.


  - name: stg_nations
    description: >-
      Nations from the TPCH nation source, with one row per nation key.
      Standardizes nation names, region keys, and source comments for
      joining customers to their geographic nation and region.
