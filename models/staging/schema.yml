version: 2

models:
  - name: stg_customers
    description: >-
      One row per customer from tpch.customer, with source fields renamed for
      downstream joins and customer segmentation. Includes customers without orders.
    columns:
      - name: customer_key
        description: Customer identifier used to join orders to the customer record.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Customer name as supplied by the source; not a unique identifier.
      - name: address
        description: Customer address text, passed through without normalization.
      - name: nation_key
        description: Source nation identifier corresponding to stg_nations.nation_key.
      - name: phone_number
        description: Source customer phone number, preserved as supplied.
      - name: account_balance
        description: Source customer account balance; no currency conversion is applied.
      - name: market_segment
        description: Source customer segment used to group monthly gross sales.
        data_tests:
          - not_null
      - name: comment
        description: Free-text source comment about the customer.

  - name: stg_orders
    description: >-
      One row per order from tpch.orders. Preserves source order attributes and
      total_price; downstream sales amounts are calculated separately from line items.
    columns:
      - name: order_key
        description: Order identifier and join key for order line items.
        data_tests:
          - unique
          - not_null
      - name: customer_key
        description: Customer that placed the order; references stg_customers.customer_key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_key
      - name: status_code
        description: Source order status code, preserved without translation.
        data_tests:
          - accepted_values:
              arguments:
                values: ['O', 'P', 'F']
      - name: total_price
        description: Source order total; not used to calculate the fact model's sales amounts.
      - name: order_date
        description: Source order date used to assign sales to calendar months.
        data_tests:
          - not_null
      - name: clerk_name
        description: Source identifier for the clerk associated with the order.
      - name: priority_code
        description: Source order priority label, preserved without translation.
      - name: ship_priority
        description: Source shipping priority value, preserved without translation.
      - name: comment
        description: Free-text source comment about the order.

  - name: stg_line_items
    description: >-
      One row per order_key and line_number from tpch.lineitem. Renames source
      fields and calculates per-unit prices, negative discounts, tax on discounted
      sales, and tax-inclusive net sales. Calculated amounts are cast to decimal(16,4).
      No currency conversion or return/status filtering is applied.
    columns:
      - name: order_key
        description: Parent order identifier; forms the line-item key with line_number.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_key
      - name: part_key
        description: Source part identifier corresponding to stg_parts.part_key.
      - name: supplier_key
        description: Source supplier identifier corresponding to stg_suppliers.supplier_key.

      - name: line_number
        description: Line number within an order, not globally unique.
        data_tests:
          - not_null
      - name: quantity
        description: Quantity for the entire line; zero makes per-unit prices null.
      - name: gross_item_sales_amount
        description: Source extended price for the entire line, before discounts and tax.
      - name: discount_percentage
        description: Fractional discount rate; 0.10 represents a 10 percent discount.
      - name: tax_rate
        description: Fractional tax rate applied to gross sales after discount.
      - name: return_flag
        description: Source return flag, preserved without translating or filtering returns.
        data_tests:
          - accepted_values:
              arguments:
                values: ['R', 'A', 'N']
      - name: status_code
        description: Source line status code, distinct from the parent order's status.
        data_tests:
          - accepted_values:
              arguments:
                values: ['O', 'F']
      - name: ship_date
        description: Source shipment date for the line item.
      - name: commit_date
        description: Source committed date for the line item.
      - name: receipt_date
        description: Source receipt date for the line item.
      - name: ship_instructions
        description: Source shipping instructions for the line item.
      - name: ship_mode
        description: Source shipping mode for the line item.
      - name: comment
        description: Free-text source comment about the line item.
      - name: base_price
        description: Gross line sales divided by quantity, cast to four decimals; null for zero quantity.
      - name: discounted_price
        description: Rounded base_price multiplied by one minus the discount rate, cast to four decimals.
      - name: discounted_item_sales_amount
        description: Gross line sales multiplied by one minus the discount rate, before tax.
      - name: item_discount_amount
        description: Negative gross line sales multiplied by the discount rate; discounts reduce sales.
      - name: item_tax_amount
        description: Gross line sales plus the negative discount amount, multiplied by tax_rate.
      - name: net_item_sales_amount
        description: Gross line sales plus the negative discount amount plus tax; includes tax.

data_tests:
  - name: assert_stg_line_items_grain
    description: >-
      Fails when an order_key and line_number pair occurs more than once. Inspect
      duplicate keys in tpch.lineitem before changing downstream aggregations.
