version: 2

models:
  - name: stg_customers
    description: >-
      Customer records from the TPCH customer source, with one row per
      customer_key. Renames source fields for customer contact details,
      nation, account balance, and market segment without filtering records.

  - name: stg_line_items
    description: >-
      Order line items from the TPCH lineitem source, with one row per
      order_key and line_number. Includes product and supplier keys, quantity,
      shipping details, and return and line statuses. Calculates unit prices,
      discounted gross sales, negative discount amounts, tax on discounted
      sales, and net sales including tax. No status or return filters are applied.

  - name: stg_nations
    description: >-
      Nation reference data from the TPCH nation source, with one row per
      nation_key. Provides the nation name, parent region_key, and source
      comment for enriching customer geography. No records are filtered.

  - name: stg_orders
    description: >-
      Order headers from the TPCH orders source, with one row per order_key.
      Includes customer_key, order date, total price, status, clerk, priority,
      shipping priority, and source comment. Retains all order statuses.

  - name: stg_regions
    description: >-
      Region reference data from the TPCH region source, with one row per
      region_key. Renames the region key, name, and source comment for use
      in geographic enrichment. No records are filtered.
