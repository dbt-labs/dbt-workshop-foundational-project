version: 2

models:
  - name: stg_customers
    description: >-
      Customer records from the TPCH customer source, with one row per
      customer_key. Standardizes customer identifiers, contact details,
      nation membership, account balance, and market segment for downstream joins.

  - name: stg_orders
    description: >-
      Order headers from the TPCH orders source, with one row per order_key.
      Standardizes customer identifiers, order dates, status and priority
      codes, clerk details, and the source order total.

  - name: stg_line_items
    description: >-
      Order line items from the TPCH lineitem source, with one row per
      order_key and line_number combination. Standardizes product, supplier,
      quantity, and shipping fields and calculates unit prices, discounts,
      tax amounts, and net item sales. Discounts are represented as negative
      amounts, and net item sales include tax.

  - name: stg_nations
    description: >-
      Nation reference data from the TPCH nation source, with one row per
      nation_key. Provides nation names and their region_key for enriching
      customer geography.

  - name: stg_regions
    description: >-
      Region reference data from the TPCH region source, with one row per
      region_key. Provides region names for grouping nations and customers
      into geographic regions.
