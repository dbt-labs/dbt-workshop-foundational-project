version: 2

sources:
  - name: tpch
    description: Raw TPCH sample data loaded from Snowflake's shared `snowflake_sample_data.tpch_sf1` schema.
    database: snowflake_sample_data
    schema: tpch_sf1
    tables:
      - name: customer
        description: One record per customer.
        columns:
          - name: c_custkey
            description: Primary key for the customer.
            data_tests:
              - not_null
              - unique
          - name: c_nationkey
            description: Foreign key to the customer's nation.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'nation')
                    field: n_nationkey
          - name: c_name
            description: Customer name.
          - name: c_mktsegment
            description: Market segment assigned to the customer.

      - name: lineitem
        description: One record per order line item. This table sits at the lowest transactional grain in TPCH.
        columns:
          - name: l_orderkey
            description: Foreign key to the parent order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'orders')
                    field: o_orderkey
          - name: l_partkey
            description: Foreign key to the part sold on the line item.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'part')
                    field: p_partkey
          - name: l_suppkey
            description: Foreign key to the supplier fulfilling the line item.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'supplier')
                    field: s_suppkey
          - name: l_linenumber
            description: Line number within an order.
            data_tests:
              - not_null
          - name: l_quantity
            description: Quantity ordered for the line item.
          - name: l_extendedprice
            description: Extended price for the line item before discount and tax.
          - name: l_discount
            description: Discount rate applied to the line item.
          - name: l_tax
            description: Tax rate applied to the line item.

      - name: nation
        description: Reference table of nations.
        columns:
          - name: n_nationkey
            description: Primary key for the nation.
            data_tests:
              - not_null
              - unique
          - name: n_regionkey
            description: Foreign key to the region containing the nation.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'region')
                    field: r_regionkey
          - name: n_name
            description: Nation name.

      - name: orders
        description: One record per order.
        columns:
          - name: o_orderkey
            description: Primary key for the order.
            data_tests:
              - not_null
              - unique
          - name: o_custkey
            description: Foreign key to the customer who placed the order.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'customer')
                    field: c_custkey
          - name: o_orderdate
            description: Date the order was placed.
            data_tests:
              - not_null
          - name: o_totalprice
            description: Total price recorded for the order.
            data_tests:
              - not_null
          - name: o_orderstatus
            description: Current order status code.

      - name: part
        description: Reference table of parts available for sale.
        columns:
          - name: p_partkey
            description: Primary key for the part.
            data_tests:
              - not_null
              - unique
          - name: p_name
            description: Part name.
          - name: p_brand
            description: Brand assigned to the part.
          - name: p_type
            description: Type classification for the part.
          - name: p_retailprice
            description: Retail price for the part.
            data_tests:
              - not_null

      - name: partsupp
        description: Bridge table with one record per supplier-part combination and related supply attributes.
        columns:
          - name: ps_partkey
            description: Foreign key to the part.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'part')
                    field: p_partkey
          - name: ps_suppkey
            description: Foreign key to the supplier.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'supplier')
                    field: s_suppkey
          - name: ps_availqty
            description: Available quantity supplied for the part-supplier pair.
            data_tests:
              - not_null
          - name: ps_supplycost
            description: Supply cost for the part-supplier pair.
            data_tests:
              - not_null

      - name: region
        description: Reference table of geographic regions.
        columns:
          - name: r_regionkey
            description: Primary key for the region.
            data_tests:
              - not_null
              - unique
          - name: r_name
            description: Region name.

      - name: supplier
        description: One record per supplier.
        columns:
          - name: s_suppkey
            description: Primary key for the supplier.
            data_tests:
              - not_null
              - unique
          - name: s_nationkey
            description: Foreign key to the supplier's nation.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tpch', 'nation')
                    field: n_nationkey
          - name: s_name
            description: Supplier name.
          - name: s_acctbal
            description: Supplier account balance.
