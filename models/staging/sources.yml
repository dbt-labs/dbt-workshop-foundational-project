sources:
  - name: tpch
    description: "TPCH data source from Snowflake Sample Data"
    database: snowflake_sample_data
    schema: tpch_sf1
    tables:
      - name: orders
        description: "One record per order"
        config:
          # Use metadata because the shared sample table has no ingestion timestamp.
          loaded_at_query: >-
            select max(last_altered)
            from SNOWFLAKE_SAMPLE_DATA.INFORMATION_SCHEMA.TABLES
            where table_schema = 'TPCH_SF1' and table_name = 'ORDERS'
      - name: customer
        description: "One record per customer"
        config:
          loaded_at_query: >-
            select max(last_altered)
            from SNOWFLAKE_SAMPLE_DATA.INFORMATION_SCHEMA.TABLES
            where table_schema = 'TPCH_SF1' and table_name = 'CUSTOMER'
      - name: lineitem
        description: "One record per line item within a single order (1 -> n)"
        config:
          loaded_at_query: >-
            select max(last_altered)
            from SNOWFLAKE_SAMPLE_DATA.INFORMATION_SCHEMA.TABLES
            where table_schema = 'TPCH_SF1' and table_name = 'LINEITEM'

      - name: nation 
      - name: part 
      - name: partsupp 
      - name: region 
      - name: supplier