version: 2

sources:
  - name: tpch
    description: Raw TPCH sample data in Snowflake.
    database: snowflake_sample_data
    schema: tpch_sf1
    tables:
      - name: customer
        description: One record per customer.
      - name: lineitem
        description: One record per order line item.
      - name: nation
        description: One record per nation.
      - name: orders
        description: One record per order.
      - name: part
        description: One record per part.
      - name: partsupp
        description: One record per part-supplier relationship.
      - name: region
        description: One record per region.
      - name: supplier
        description: One record per supplier.
