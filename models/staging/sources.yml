sources:
  - name: tpch
    description: >-
      TPC-H sample order, customer, product, supplier, and geography data in
      tpch_now.tpch, plus a local test table. Source values are preserved by
      staging models; no currency conversion or business filtering is applied.
    database: tpch_now
    schema: tpch
    tables:
      - name: orders
        description: One record per order header, identified by o_orderkey.
      - name: customer
        description: One record per customer, including customers without orders.
      - name: lineitem
        description: One record per order line, identified by l_orderkey and l_linenumber.
      - name: nation
        description: Nation lookup; one record per n_nationkey, linked to a region.
        columns:
          - name: n_nationkey
            description: Nation identifier; zero is a valid key.
            data_tests: [unique, not_null]
          - name: n_name
            description: Source nation name.
          - name: n_regionkey
            description: Region containing the nation; joins to region.r_regionkey.
            data_tests: [not_null]
          - name: n_comment
            description: Free-text nation comment.
      - name: region
        description: Geographic region lookup; one record per r_regionkey.
        columns:
          - name: r_regionkey
            description: Region identifier; zero is a valid key.
            data_tests: [unique, not_null]
          - name: r_name
            description: Source region name.
          - name: r_comment
            description: Free-text region comment.
      - name: part
        description: Product catalog; one record per p_partkey.
        columns:
          - name: p_partkey
            description: Part identifier used by lineitem and partsupp.
            data_tests: [unique, not_null]
          - name: p_name
            description: Source part name.
          - name: p_mfgr
            description: Source manufacturer label.
          - name: p_brand
            description: Source brand label.
          - name: p_type
            description: Source part classification.
          - name: p_size
            description: Source numeric size classification.
          - name: p_container
            description: Source packaging or container classification.
          - name: p_retailprice
            description: Catalog retail price; distinct from actual line-item sales prices.
          - name: p_comment
            description: Free-text part comment.
      - name: supplier
        description: Supplier directory; one record per s_suppkey.
        columns:
          - name: s_suppkey
            description: Supplier identifier used by lineitem and partsupp.
            data_tests: [unique, not_null]
          - name: s_name
            description: Source supplier name.
          - name: s_address
            description: Supplier address in source format.
          - name: s_nationkey
            description: Supplier nation; joins to nation.n_nationkey.
            data_tests: [not_null]
          - name: s_phone
            description: Supplier telephone number in source format.
          - name: s_acctbal
            description: Supplier account balance; not a sales or supply-cost measure.
          - name: s_comment
            description: Free-text supplier comment.
      - name: partsupp
        description: Supply catalog; one record per combination of ps_partkey and ps_suppkey.
        columns:
          - name: ps_partkey
            description: Part supplied; part of the composite primary key.
            data_tests: [not_null]
          - name: ps_suppkey
            description: Supplier of the part; part of the composite primary key.
            data_tests: [not_null]
          - name: ps_availqty
            description: Available units of this part from this supplier.
          - name: ps_supplycost
            description: Source supply cost per unit for this part-supplier pair.
          - name: ps_comment
            description: Free-text part-supplier comment.
      - name: tbl_test
        description: >-
          Local single-column test table, separate from the TPC-H business entities.
          Its business purpose is unspecified; staged without filtering.
        columns:
          - name: id
            description: Source record identifier; currently unique and non-null.
            data_tests: [unique, not_null]
