version: 2

sources:
  - name: tpch
    description: >-
      TPCH source data in tpch_now.tpch, including customers, orders, line items,
      parts, suppliers, part-supplier availability, and geographic lookups.
      The auxiliary tbl_test table has no confirmed business purpose.
    database: tpch_now
    schema: tpch
    tables:
      - name: orders
        description: One record per order.
      - name: customer
        description: One record per customer.
      - name: lineitem
        description: One record per order and line number.
      - name: nation
        description: One record per nation, linked to its geographic region.
        columns:
          - name: n_nationkey
            description: Nation identifier.
          - name: n_name
            description: Source nation name.
          - name: n_regionkey
            description: Region containing the nation.
          - name: n_comment
            description: Free-text nation comment.
      - name: region
        description: One record per geographic region.
        columns:
          - name: r_regionkey
            description: Region identifier.
          - name: r_name
            description: Source region name.
          - name: r_comment
            description: Free-text region comment.
      - name: part
        description: One record per part in the TPCH product catalog.
        columns:
          - name: p_partkey
            description: Part identifier.
          - name: p_name
            description: Source part name.
          - name: p_mfgr
            description: Source manufacturer label.
          - name: p_brand
            description: Source brand label.
          - name: p_type
            description: Source part-type classification.
          - name: p_size
            description: Source part size; measurement units are unspecified.
          - name: p_container
            description: Source packaging classification.
          - name: p_retailprice
            description: Source retail price; currency is unspecified.
          - name: p_comment
            description: Free-text part comment.
      - name: supplier
        description: One record per supplier, linked to its nation.
        columns:
          - name: s_suppkey
            description: Supplier identifier.
          - name: s_name
            description: Source supplier name.
          - name: s_address
            description: Supplier mailing address.
          - name: s_nationkey
            description: Nation associated with the supplier.
          - name: s_phone
            description: Supplier phone number in source format.
          - name: s_acctbal
            description: Source account balance; currency is unspecified.
          - name: s_comment
            description: Free-text supplier comment.
      - name: partsupp
        description: One record per part and supplier, with available quantity and supply cost.
        columns:
          - name: ps_partkey
            description: Part offered by the supplier; part of the composite key.
          - name: ps_suppkey
            description: Supplier offering the part; part of the composite key.
          - name: ps_availqty
            description: Source available quantity for this part-supplier pair.
          - name: ps_supplycost
            description: Source supply cost for this part-supplier pair; currency is unspecified.
          - name: ps_comment
            description: Free-text part-supplier comment.
      - name: tbl_test
        description: Auxiliary source table containing an ID; business purpose is unspecified.
        columns:
          - name: id
            description: Source identifier, observed to be unique and non-null.
