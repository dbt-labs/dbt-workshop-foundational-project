version: 2

sources:
  - name: tpch
    description: >-
      TPCH transactional and reference data plus the auxiliary tbl_test table.
      Source fields are renamed in staging without filtering. Key and relationship
      assertions are defined on staging models to avoid duplicate scans.
      Orders and lineitem expose loaded_at metadata, but no freshness SLA is configured.
    database: tpch_now
    schema: tpch
    tables:
      - name: orders
        description: >-
          One record per source order, identified by o_orderkey. o_custkey
          links to customer.c_custkey; o_orderdate determines the reporting month.
        columns:
          - name: o_orderkey
            description: Source order identifier, renamed to order_key in stg_orders.
          - name: o_custkey
            description: Customer identifier referencing customer.c_custkey.
          - name: o_orderstatus
            description: Source order status code retained without filtering or reclassification.
          - name: o_totalprice
            description: Source-reported order total; modeled sales are independently calculated from line items.
          - name: o_orderdate
            description: Date the order was placed; used to assign orders to reporting months.
          - name: o_clerk
            description: Clerk assigned to the order, renamed to clerk_name in staging.
          - name: o_orderpriority
            description: Source order priority; the urgent-order analysis selects the code 1-URGENT.
          - name: o_shippriority
            description: Source shipping priority value.
          - name: o_comment
            description: Free-text source comment about the order.
          - name: loaded_at
            description: Source-provided timestamp metadata; load/update semantics are unconfirmed and no freshness threshold is assumed.
      - name: customer
        description: >-
          One record per source customer, identified by c_custkey. c_mktsegment
          supplies the customer market segment used in reporting.
        columns:
          - name: c_custkey
            description: Source customer identifier, renamed to customer_key in stg_customers.
          - name: c_name
            description: Customer name attached to orders through the customer key.
          - name: c_address
            description: Customer mailing address retained unchanged in staging.
          - name: c_nationkey
            description: Source nation identifier referencing nation.n_nationkey.
          - name: c_phone
            description: Customer phone number retained in source format.
          - name: c_acctbal
            description: Source customer account balance; not a calculated sales metric.
          - name: c_mktsegment
            description: Customer market segment used by marts and analyses.
          - name: c_comment
            description: Free-text source comment about the customer.
      - name: lineitem
        description: >-
          One record per order line, identified by (l_orderkey, l_linenumber).
          l_extendedprice is the gross amount for the whole line; l_discount
          and l_tax are fractional rates used to calculate discounted and net sales.
        columns:
          - name: l_orderkey
            description: Parent order identifier referencing orders.o_orderkey.
          - name: l_partkey
            description: Source part identifier referencing part.p_partkey.
          - name: l_suppkey
            description: Source supplier identifier referencing supplier.s_suppkey.
          - name: l_linenumber
            description: Line sequence within an order; forms the composite key with l_orderkey.
          - name: l_quantity
            description: Quantity for the line; staging returns null per-unit prices when this value is zero.
          - name: l_extendedprice
            description: Gross extended price for the full line before discounts and tax, not a unit price.
          - name: l_discount
            description: Discount fraction; 0.10 means 10 percent and produces a negative discount amount in staging.
          - name: l_tax
            description: Tax fraction applied after the line discount.
          - name: l_returnflag
            description: Source return flag; staging and marts do not filter on this field.
          - name: l_linestatus
            description: Source line status code, distinct from orders.o_orderstatus.
          - name: l_shipdate
            description: Source shipment date for the line.
          - name: l_commitdate
            description: Source committed date for the line.
          - name: l_receiptdate
            description: Source receipt date for the line.
          - name: l_shipinstruct
            description: Source shipping instructions for the line.
          - name: l_shipmode
            description: Source shipping mode for the line.
          - name: l_comment
            description: Free-text source comment about the line.
          - name: loaded_at
            description: Source-provided timestamp metadata; load/update semantics are unconfirmed and no freshness threshold is assumed.
      - name: region
        description: One row per TPCH region, identified by r_regionkey; parent reference for nations.
        columns:
          - name: r_regionkey
            description: Source region primary key; zero is a valid value.
          - name: r_name
            description: Region label used for geographic rollups.
          - name: r_comment
            description: Free-text source comment about the region.
      - name: nation
        description: One row per TPCH nation, identified by n_nationkey and linked to a region by n_regionkey.
        columns:
          - name: n_nationkey
            description: Source nation primary key; zero is a valid value.
          - name: n_name
            description: Nation label used for customer and supplier geography.
          - name: n_regionkey
            description: Parent region identifier referencing region.r_regionkey.
          - name: n_comment
            description: Free-text source comment about the nation.
      - name: supplier
        description: One row per TPCH supplier, identified by s_suppkey and linked to a nation.
        columns:
          - name: s_suppkey
            description: Source supplier primary key referenced by partsupp and lineitem.
          - name: s_name
            description: Supplier name retained unchanged in staging.
          - name: s_address
            description: Source supplier mailing address.
          - name: s_nationkey
            description: Supplier nation identifier referencing nation.n_nationkey.
          - name: s_phone
            description: Source supplier phone number.
          - name: s_acctbal
            description: Source supplier account balance; not a sales or supply-cost calculation.
          - name: s_comment
            description: Free-text source comment about the supplier.
      - name: part
        description: One row per TPCH part, identified by p_partkey, with product attributes and retail price.
        columns:
          - name: p_partkey
            description: Source part primary key referenced by partsupp and lineitem.
          - name: p_name
            description: Source descriptive part name.
          - name: p_mfgr
            description: Source manufacturer label.
          - name: p_brand
            description: Source brand label.
          - name: p_type
            description: Source product type classification.
          - name: p_size
            description: Source numeric size attribute; no measurement unit is inferred.
          - name: p_container
            description: Source packaging or container classification.
          - name: p_retailprice
            description: Source retail price; distinct from supplier cost and transactional sales.
          - name: p_comment
            description: Free-text source comment about the part.
      - name: partsupp
        description: >-
          One row per (ps_partkey, ps_suppkey) pair, recording availability and
          supply cost for a part offered by a supplier. No history timestamp is supplied.
        columns:
          - name: ps_partkey
            description: Part identifier referencing part.p_partkey; first component of the composite key.
          - name: ps_suppkey
            description: Supplier identifier referencing supplier.s_suppkey; second component of the composite key.
          - name: ps_availqty
            description: Source quantity available for this specific part-supplier pair.
          - name: ps_supplycost
            description: Source supply cost for this specific part-supplier pair.
          - name: ps_comment
            description: Free-text source comment about the part-supplier pair.
      - name: tbl_test
        description: >-
          Auxiliary source table containing an ID column. Business meaning and
          grain are unconfirmed; observed ID integrity is monitored with warnings in staging.
        columns:
          - name: id
            description: Source identifier retained unchanged; no business-key contract has been confirmed.
