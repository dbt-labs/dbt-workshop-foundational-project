version: 2

sources:
  - name: tpch
    database: snowflake_sample_data
    schema: tpch_sf1
    tables:
      - name: orders
        description: One record per order.
        columns:
          - name: o_orderkey
            description: Primary key for the order.
            data_tests:
              - not_null
              - unique

      - name: customer
        description: One record per customer.
        columns:
          - name: c_custkey
            description: Primary key for the customer.
            data_tests:
              - not_null
              - unique

      - name: lineitem
        description: One record per line item within a single order.
        columns:
          - name: l_orderkey
            description: Foreign key to the order.
            data_tests:
              - not_null

      - name: nation
        description: One record per nation.
        columns:
          - name: n_nationkey
            description: Primary key for the nation.
            data_tests:
              - not_null
              - unique

      - name: region
        description: One record per region.
        columns:
          - name: r_regionkey
            description: Primary key for the region.
            data_tests:
              - not_null
              - unique
