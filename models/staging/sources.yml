sources:
  - name: tpch
    description: My Sales Data #added config
    database: snowflake_sample_data #raw
    schema: tpch_sf1 #tpch
    tables:
      - name: orders
        description: "One record per order"
      - name: customer
        description: "One record per customer"
      - name: lineitem
        description: "One record per line item within a single order (1 -> n)"
      - name: nation
        description: "Reference table for nations"
      - name: part
        description: "One record per part"
      - name: partsupp
        description: "Bridge table between parts and suppliers"
      - name: region
        description: "Reference table for regions"
      - name: supplier
        description: "One record per supplier"
