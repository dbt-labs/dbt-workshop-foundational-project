version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment for sales trend reporting.
      One row per order_month and market_segment present in fct_orders; months and
      segments without orders are not filled with zero-valued rows. Revenue is the
      sum of gross_item_sales_amount, not net sales. All rows available in
      fct_orders are included, with no additional order-status or date filters.
    columns:
      - name: order_month
        description: >-
          Order date truncated to the start of its calendar month. Together with
          market_segment, identifies one row in this model.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment carried through fct_orders from stg_customers.
          Used with order_month to group gross item sales.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the calendar month and
          customer market segment. This is gross item sales, not the upstream
          net_item_sales_amount measure; no currency conversion is applied here.
        data_tests:
          - not_null

data_tests:
  - name: assert_monthly_sales_grain
    description: >-
      Ensures each order_month and market_segment combination appears at most
      once. If this fails, check for changes to the grouping in monthly_sales.
  - name: assert_monthly_sales_month_start
    description: >-
      Ensures order_month is truncated to the start of its calendar month. If
      this fails, check the date truncation in monthly_sales.
