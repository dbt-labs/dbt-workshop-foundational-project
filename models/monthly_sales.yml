models:
  - name: monthly_sales
    description: "Monthly gross sales revenue by market segment. One row per order month and market segment."
    data_tests:
      - unique:
          arguments:
            column_name: "concat_ws('||', order_month::varchar, market_segment)"
    columns:
      - name: order_month
        description: "Calendar month of the orders included in the revenue total."
        data_tests:
          - not_null
      - name: market_segment
        description: "Customer market segment associated with the orders."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AUTOMOBILE
                  - BUILDING
                  - FURNITURE
                  - HOUSEHOLD
                  - MACHINERY
      - name: total_revenue
        description: "Sum of gross item sales amount for the month and market segment."
        data_tests:
          - not_null
