version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales summarized from fct_orders, with one row per
      calendar month and customer market segment. Includes all orders available
      in fct_orders, without filtering order status. Only month and segment
      combinations with orders are included; missing combinations are not
      filled with zeros.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          Calendar month of the order date, truncated to the first day of the
          month. Together with market_segment, identifies a row.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment from fct_orders. Together with order_month,
          identifies a row.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount for orders in the month and market
          segment. This is gross item sales before discounts and taxes, not
          net revenue.
        data_tests:
          - not_null
