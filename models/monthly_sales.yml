version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, aggregated from fct_orders.
      Each row represents one calendar month and market segment with orders.
      Months without orders are not filled in. All orders present in fct_orders
      are included, with no additional order-status filter. Revenue is gross
      item sales before discounts and tax, rather than net revenue.
    data_tests:
      - unique:
          arguments:
            column_name: "(to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment)"
          description: >-
            Ensures there is at most one row per calendar month and market
            segment. Investigate changes to the aggregation grain if this fails.
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month. Together
          with market_segment, identifies the grain of this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment carried from fct_orders. Sales are attributed
          to the segment of the customer associated with each order.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the calendar month and
          market segment. This is gross item sales before discounts and tax;
          no currency conversion is performed by this model.
        data_tests:
          - not_null
