version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders. One row per order_month and market_segment combination.
      Only combinations with orders are included; months without sales are
      not filled in.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month.
          Together with market_segment, defines the grain of this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment from fct_orders, used to group monthly sales.
          Together with order_month, defines the grain of this model.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment. Represents gross item sales, not net item sales.
        data_tests:
          - not_null
