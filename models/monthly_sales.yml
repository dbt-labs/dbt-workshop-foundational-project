version: 2

models:
  - name: monthly_sales
    description: >
      Monthly revenue summary for sales analysis. Each row represents one calendar
      month and market segment, with revenue aggregated from `fct_orders`.
    columns:
      - name: order_month
        description: The first day of the calendar month in which the order was placed.
        data_tests:
          - not_null
      - name: market_segment
        description: The market segment assigned to the orders included in the monthly revenue total.
      - name: total_revenue
        description: The sum of gross item sales amounts for the month and market segment.
