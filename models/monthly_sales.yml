version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates fct_orders by
      order date without filtering order status. Only combinations present in
      fct_orders are included; missing months or segments are not zero-filled.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          description: Ensures there is only one row per month and market segment.
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month.
          Together with market_segment, defines the grain of the model.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment carried from fct_orders, which joins orders
          to customers. Together with order_month, defines the grain of the model.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment. Represents gross item sales before item discounts
          and tax, rather than net revenue.
        data_tests:
          - not_null
