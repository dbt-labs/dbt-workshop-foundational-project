version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, for reporting sales trends
      across segments. One row per order_month and market_segment combination
      present in fct_orders. Includes all order statuses in fct_orders, which
      contains only orders with matching line items and customers. Missing
      month-segment combinations are not filled with zero-revenue rows, and
      months are not restricted to completed calendar months.
    data_tests:
      - unique:
          name: unique_monthly_sales_month_segment
          description: >-
            Ensures one row per calendar month and market segment. If this fails,
            check for changes to the grouping columns in monthly_sales.
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          Calendar month of the order, derived by truncating fct_orders.order_date
          to the first day of the month. Together with market_segment, defines
          the row grain.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment inherited from fct_orders for the customer
          associated with each order. Together with order_month, defines the
          row grain.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the calendar month and
          customer market segment. This is gross line-item extended sales value,
          before discounts and excluding taxes; it is not net revenue. No
          currency conversion is applied by this model.
        data_tests:
          - not_null
