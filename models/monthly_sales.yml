version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders using the order date. The grain is one row per order_month
      and market_segment combination. Only combinations with orders are
      included; months and segments without orders are not zero-filled.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          description: >-
            Ensures each month and market segment combination appears once.
          arguments:
            column_name: "array_construct(order_month, market_segment)"
    columns:
      - name: order_month
        description: >-
          Order date truncated to the start of its calendar month. Together
          with market_segment, identifies a row in this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment supplied by fct_orders. Sales are attributed
          to the segment of the customer who placed the order.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment. Represents gross item sales, not the upstream
          net_item_sales_amount measure; no currency conversion is applied
          by this model.
        data_tests:
          - not_null
