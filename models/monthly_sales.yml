version: 2

models:
  - name: monthly_sales
    description: Monthly gross item sales summarized by customer market segment. The model has one row for each `order_month` and `market_segment` combination represented in `fct_orders`.
    columns:
      - name: order_month
        description: First day of the calendar month in which the underlying orders were placed; used as the monthly reporting period.
        data_tests:
          - not_null

      - name: market_segment
        description: Customer market segment associated with the orders contributing to the monthly revenue total.
        data_tests:
          - not_null

      - name: total_revenue
        description: Sum of gross item sales for orders in the reporting month and customer market segment.
        data_tests:
          - not_null
