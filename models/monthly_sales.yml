version: 2

models:
  - name: monthly_sales
    description: Monthly gross item revenue by customer market segment. Each row represents one calendar month and market segment, providing a reporting-ready rollup of `fct_orders`.
    columns:
      - name: order_month
        description: First day of the calendar month in which the order was placed; used with `market_segment` to identify each monthly rollup.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment associated with the order. Used with `order_month` to define the model grain.
        data_tests:
          - not_null
      - name: total_revenue
        description: Sum of `gross_item_sales_amount` for orders in the month and market segment, before discounts and taxes.
        data_tests:
          - not_null
