version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates all orders present
      in fct_orders without filtering by order status. Only month and segment
      combinations with orders are included; missing combinations are not zero-filled.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "(to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment)"
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date, derived by
          truncating fct_orders.order_date to month. Together with market_segment,
          identifies a row in this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment carried through fct_orders from stg_customers.
          Together with order_month, identifies a row in this model.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the month and customer
          market segment. Represents gross item sales, not the separate net item
          sales measure, and does not subtract item discounts or add item tax.
          Uses the same currency and units as the upstream gross sales amount.
        data_tests:
          - not_null
