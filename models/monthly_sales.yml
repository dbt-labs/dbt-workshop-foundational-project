version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders. Each row represents one calendar month and market segment.
      Includes all orders present in fct_orders without an additional status
      filter; month-segment combinations with no orders are not generated.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_market_segment
          arguments:
            column_name: "to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment"
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date, derived
          by truncating fct_orders.order_date to the month.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment from fct_orders, used with order_month to
          define the grain of this model.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the calendar month and
          market segment. This is gross item sales before discounts and tax,
          not net sales or the final amount charged to customers.
        data_tests:
          - not_null
