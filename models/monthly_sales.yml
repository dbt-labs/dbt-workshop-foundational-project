version: 2

models:
  - name: monthly_sales
    description: Monthly gross revenue by customer market segment, aggregated from the order-grain fact table.
    columns:
      - name: order_month
        description: First calendar day of the month in which the order was placed.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment for the aggregated orders.
      - name: total_revenue
        description: Sum of order gross item sales before discounts and tax for the month and market segment.
