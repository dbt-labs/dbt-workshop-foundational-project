version: 2

models:
  - name: monthly_sales
    description: Monthly gross revenue summarized by market segment.
    columns:
      - name: order_month
        description: Calendar month in which orders were placed.
        data_tests:
          - not_null
      - name: market_segment
        description: Customer market segment associated with the order.
        data_tests:
          - not_null
      - name: total_revenue
        description: Total gross item sales amount for the month and market segment.
        data_tests:
          - not_null
