version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates all orders in
      fct_orders by order date without filtering order status. Only month and
      segment combinations with orders are included; missing combinations are
      not filled with zeroes, and the current month may be incomplete.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "(to_char(order_month, 'YYYY-MM-DD') || '|' || market_segment)"
    columns:
      - name: order_month
        description: >-
          Order date truncated to the first day of its calendar month using
          DATE_TRUNC('month', order_date). Together with market_segment,
          defines the grain of this model.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment carried through fct_orders from stg_customers.
          Together with order_month, defines the grain of this model.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment. This is gross item sales, not net sales; it does not
          subtract item_discount_amount or add item_tax_amount.
        data_tests:
          - not_null
