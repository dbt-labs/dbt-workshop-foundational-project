version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders. The grain is one row per order_month and market_segment.
      Only month and segment combinations with orders are included; missing
      combinations are not filled with zeroes. The current month may be partial.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_json(array_construct(order_month, market_segment))"
    columns:
      - name: order_month
        description: >-
          Calendar month of the order, derived by truncating order_date to the
          first day of the month. Together with market_segment, identifies a row.
        data_tests:
          - not_null
      - name: market_segment
        description: >-
          Customer market segment carried through fct_orders from stg_customers.
          Together with order_month, identifies a row.
        data_tests:
          - not_null
      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          market segment. This is gross item sales, not net sales; no discount
          or tax adjustment is applied by this model. Amounts retain the units
          of the upstream field, with no currency conversion.
        data_tests:
          - not_null
