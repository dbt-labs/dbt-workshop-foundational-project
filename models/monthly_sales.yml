version: 2

models:
  - name: monthly_sales
    description: >-
      Monthly gross sales by customer market segment, with one row per
      order_month and market_segment combination. Aggregates all orders present
      in fct_orders using the order date, without filtering order status.
      Only month and segment combinations with orders are included; missing
      combinations are not filled with zero revenue.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          description: Ensures each month and market segment combination appears only once.
          arguments:
            column_name: "(to_varchar(order_month, 'YYYY-MM-DD') || '|' || market_segment)"
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date. Together
          with market_segment, defines the grain of this model.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment from fct_orders, inherited from the customer
          associated with each order. Together with order_month, defines the
          grain of this model.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of gross_item_sales_amount from fct_orders for the month and
          customer market segment. Represents gross line-item extended sales
          amounts before discounts and tax, rather than net sales.
        data_tests:
          - not_null
