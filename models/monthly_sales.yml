models:
  - name: monthly_sales
    description: >-
      Monthly gross item sales by customer market segment, aggregated from
      fct_orders. Contains one row per order month and market segment for
      combinations present in the order data; missing combinations are not
      filled with zeroes. Includes all order statuses present in fct_orders.
    data_tests:
      - unique:
          name: monthly_sales_unique_month_segment
          arguments:
            column_name: "to_json(array_construct(order_month, market_segment))"
    columns:
      - name: order_month
        description: >-
          First day of the calendar month containing the order date, calculated
          by truncating fct_orders.order_date to the month.
        data_tests:
          - not_null

      - name: market_segment
        description: >-
          Customer market segment associated with the orders, inherited from
          fct_orders. Together with order_month, identifies a monthly sales row.
        data_tests:
          - not_null

      - name: total_revenue
        description: >-
          Sum of fct_orders.gross_item_sales_amount for the order month and
          customer market segment. Represents gross item sales rather than the
          separately calculated net item sales amount; this model does not
          apply additional discount or tax adjustments or currency conversion.
        data_tests:
          - not_null
